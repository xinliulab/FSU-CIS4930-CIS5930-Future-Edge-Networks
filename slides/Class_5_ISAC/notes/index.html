<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 5 ISAC · Speaker Notes</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1a1f26; --muted:#6b7280;
    --line:#e3e6ea; --blue:#2e5bba; --orange:#de7a24; --purple:#6d3597;
    --green:#498b4a; --hl:#fff8e6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
    font-size:16px; line-height:1.85; overflow:hidden;
  }

  /* ---- top bar ---- */
  #bar{
    height:46px; display:flex; align-items:center; gap:14px;
    padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  #bar b{font-size:14px; color:var(--blue); letter-spacing:.02em}
  #count{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  #prog{height:3px; background:var(--line)}
  #prog>i{display:block; height:100%; background:var(--blue); width:0; transition:width .18s}

  /* ---- layout ---- */
  #wrap{display:flex; height:calc(100% - 49px)}
  #left{
    flex:0 0 54%; display:flex; align-items:center; justify-content:center;
    padding:20px; background:#eceef1;
  }
  #left img{
    max-width:100%; max-height:100%; border-radius:6px;
    box-shadow:0 3px 16px rgba(20,35,60,.18); background:#fff;
  }
  #right{
    flex:1; overflow-y:auto; padding:26px 32px 90px;
    background:var(--panel); border-left:1px solid var(--line);
  }

  /* ---- notes typography ---- */
  h2{margin:0 0 4px; font-size:20px; line-height:1.4; color:#132b52}
  h3{
    margin:22px 0 8px; font-size:14px; color:var(--blue);
    padding-left:9px; border-left:3px solid var(--blue);
  }
  p{margin:0 0 12px}
  ul{margin:0 0 12px; padding-left:1.3em}
  li{margin-bottom:7px}
  b{color:#0d2340}
  .say{
    background:var(--hl); border-left:3px solid var(--orange);
    padding:12px 15px; margin:0 0 14px; border-radius:0 5px 5px 0;
  }
  .say:before{
    content:"课上这样说"; display:block; font-size:11.5px; color:var(--orange);
    letter-spacing:.1em; margin-bottom:5px; font-weight:700;
  }
  .warn{
    background:#fdf2f2; border-left:3px solid #c0392b;
    padding:12px 15px; margin:0 0 14px; border-radius:0 5px 5px 0; font-size:15px;
  }
  .warn:before{
    content:"别讲错"; display:block; font-size:11.5px; color:#c0392b;
    letter-spacing:.1em; margin-bottom:5px; font-weight:700;
  }
  .ask{
    background:#f0f5ff; border-left:3px solid var(--blue);
    padding:12px 15px; margin:0 0 14px; border-radius:0 5px 5px 0; font-size:15px;
  }
  .ask:before{
    content:"问学生"; display:block; font-size:11.5px; color:var(--blue);
    letter-spacing:.1em; margin-bottom:5px; font-weight:700;
  }
  code{
    background:#f0f2f5; padding:1px 5px; border-radius:3px;
    font-family:Consolas,monospace; font-size:14px; color:#8b3a00;
  }
  .t{font-family:Consolas,monospace; font-size:14.5px; color:var(--purple)}

  /* ---- English spoken script ---- */
  #script{
    margin:6px 0 24px; padding:20px 22px 6px;
    background:#f4f8f4; border:1px solid #cfe0cf; border-radius:7px;
    font-family:Georgia,"Times New Roman",serif; font-size:16.5px; line-height:1.78;
  }
  #script>h3.hdr{
    margin:0 0 14px; padding:0 0 10px 0; border:0; border-bottom:1px solid #cfe0cf;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    font-size:13px; color:var(--green); letter-spacing:.08em;
  }
  #script p{margin:0 0 13px}
  #script b{color:#123312}
  #script i{color:#5f7a5f; font-size:15.5px}

  /* language toggle */
  #lang{display:flex; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden}
  #lang button{
    border:0; background:#fff; color:var(--muted); cursor:pointer;
    font-family:inherit; font-size:12.5px; padding:4px 11px; border-left:1px solid var(--line);
  }
  #lang button:first-child{border-left:0}
  #lang button.on{background:var(--blue); color:#fff}
  /* One language at a time, everywhere on the page — including the hint bar. */
  body.only-en .h-zh{display:none}
  body.only-zh .h-en{display:none}

  /* ---- footer hint ---- */
  #hint{
    position:fixed; bottom:0; right:0; left:54%;
    padding:9px 32px; font-size:12px; color:var(--muted);
    background:linear-gradient(transparent,var(--panel) 45%);
    border-left:1px solid var(--line);
  }
  kbd{
    background:#fff; border:1px solid #c8cdd4; border-bottom-width:2px;
    border-radius:4px; padding:1px 6px; font-size:11px; font-family:inherit; color:#333;
  }

  @media (max-width:900px){
    body{overflow:auto}
    #wrap{flex-direction:column; height:auto}
    #left{flex:none; padding:12px}
    #right{border-left:none; border-top:1px solid var(--line); padding:20px 18px 70px}
    #hint{left:0}
  }
</style>
</head>

  <b>Class 5 · ISAC</b>
  <span id="lang">
    <button data-m="en" class="on">English</button>

  </span>

  <span class="h-en"><kbd>Enter</kbd> <kbd>→</kbd> <kbd>↓</kbd> <kbd>Space</kbd> next &nbsp;·&nbsp;

  <kbd>←</kbd> <kbd>↑</kbd> 上一页 &nbsp;·&nbsp; <kbd>Home</kbd> 回到开头 &nbsp;·&nbsp; 输入数字跳页</span>
</div>

<script>
const S = [
{s:"开场", t:"标题页", e:"Class 5: Integrated Sensing and Communication", n:`
<p>这门课到目前为止,网络一直在做一件事:<b>把比特从一头搬到另一头</b>。今天这节课要讲的是一件完全不同的事 —— 网络开始<b>看东西</b>。</p>
<div class="say">前面几节课我们讲的都是怎么把信息送出去。今天我们问一个别的问题:同一个信号,能不能在送信息的同时,顺便告诉我们外面的世界长什么样?<br><br>副标题里那三个词 —— 波形、资源分配、标准 —— 就是今天的三站。你们会发现它们其实是<b>同一个问题的三个版本</b>。</div>
<h3>你自己心里要有的一句话</h3>
<p>整节课只有一个核心思想,后面 29 页全是它的推论:</p>
<p class="t">ISAC 不是在网络旁边装一个雷达,而是把网络自己发出去的信号当雷达来读。</p>
<p>如果学生下课只记住一句话,就是这句。你在第 3 页会正式说出来,但心里从现在就要瞄着它。</p>
`},

{s:"为什么", t:"两台机器,一片天空", e:"Two machines, one sky", n:`
<p>左边是法兰克福机场的监视雷达,右边是爱立信的 5G 有源天线。这一页<b>先不要说话</b>,让两张照片摆着。</p>
<div class="say">你们看这两个东西,有什么共同点?<br><br>(等学生答。他们一定会说"都有天线"。)<br><br>对,都有天线。但还有更要紧的一层 —— 它们<b>想要的东西是一样的</b>。都要频谱、都要功率、都要天线面积、都要芯片算力。而天,只有一片。</div>
<h3>这一页在整个逻辑链里的位置</h3>
<p>它建立的是<b>动机,而且是经济动机不是技术动机</b>。学生容易以为 ISAC 是因为"技术上很酷"才做的。不是。是因为:</p>
<ul>
  <li>频谱是拍卖来的,极贵,而且不可再生;</li>
  <li>雷达和通信各建一套,等于<b>同一份硬件付两遍钱</b>。</li>
</ul>
<p>回到我们讲运营商经济那节课的老话题:每一次架构变化,都是有人想用更低的人均成本服务更多人。ISAC 也是这个逻辑,只不过省的不是基站,是<b>频谱和天线</b>。</p>
<div class="ask">如果你是运营商 CFO,有人告诉你可以不再单独买一套雷达系统,你最先问什么问题?<br><br>(想引出的答案:那通信会变差吗?—— 这正是这节课后半段整个在回答的问题。)</div>
`},

{s:"为什么", t:"一个波形,两份工作", e:"One waveform, two jobs", n:`
<p><b>这是整节课唯一那一页。</b>后面所有内容都是这一页的推论。慢一点,两个箭头都要指着讲。</p>
<h3>图在说什么</h3>
<ul>
  <li><b>蓝色箭头</b>(基站 → 手机):信号往外走,<b>载着比特</b>。这是通信,你们已经很熟了。</li>
  <li><b>橙色实线</b>(基站 → 目标):同一个信号也打在了某个物体上 —— 一辆车、一个人、一面墙。</li>
  <li><b>橙色虚线</b>(目标 → 基站):打上去的东西<b>弹回来了</b>。这条虚线是这节课的全部新意。</li>
</ul>
<div class="say">注意,这里<b>只有一次发射</b>。不是发两个信号,一个通信一个雷达 —— 是同一个信号。<br><br>它往外走的时候是<b>信息</b>,弹回来的时候是<b>测量</b>。<br><br>换个说法:你的手机在下载视频,基站发出去的那个信号,同时也在照亮马路上的一辆车,而反射回来的那一点点能量,告诉基站那辆车在哪、跑多快。整件事里没有任何人上传过这辆车的位置。</div>
<h3>学生最容易搞错的地方</h3>
<div class="warn">学生会以为 ISAC = "基站里加了个雷达模块"。这是错的,而且错得很关键。<br><br>正确的说法是:<b>雷达功能是从通信信号本身里读出来的</b>,没有加任何新的发射机。这就是为什么它省钱,也是为什么它难 —— 一个波形现在要同时满足两套互相冲突的指标。</div>
<p>橙色框那句话("ISAC 不是给网络加雷达,而是把网络自己的信号当雷达读")就是让学生抄下来的。</p>
`},

{s:"为什么", t:"回波是没人上传的数据", e:"An echo is data nobody uploaded", n:`
<p>上一页讲了原理,这一页回答"那有什么用"。左边是 Waymo 自动驾驶车顶上那一坨传感器。</p>
<h3>右边六条,别一条条念</h3>
<p>挑两三条讲透,比六条都念一遍强。我建议挑这几条:</p>
<ul>
  <li><b>车:</b> 摄像头看不见的东西,回波能看见 —— 大雾、黑夜、拐角后面。</li>
  <li><b>XR:</b> 追踪你的手,<b>不用戴任何东西</b>。现在的 VR 要么戴手柄要么靠摄像头,ISAC 直接用 Wi-Fi 信号的回波。</li>
  <li><b>IoT:</b> 数房间里有几个人,<b>不用摄像头</b> —— 这条对隐私敏感的场景特别有意思,养老院、教室。</li>
</ul>
<div class="say">这六个场景表面上八竿子打不着 —— 车、VR、数人、卫星、救灾、种地。但它们是<b>同一件事</b>:网络自己注意到了什么,而不是等某个 App 上报。<br><br>你们现在手机上所有的定位数据,都是手机<b>主动上传</b>的。ISAC 是反过来的:网络自己就知道了。</div>
<h3>这里要埋一颗钉子</h3>
<p>"不用摄像头就能数人" 听起来是个隐私优点,但反过来想 —— <b>网络在你完全不知情、也没装任何 App 的情况下,知道你在哪个房间、有没有摔倒</b>。这个隐私问题今天不展开;现在只需要让学生心里有点不舒服就够了,让他们自己带回去想。</p>
<div class="ask">网络能测到什么,是 App 测不到的?<br><br>(值得接的答案:房间里有没有人、有人摔倒了、两个街区外有辆车、下雨了。)</div>
`},

{s:"为什么", t:"感知被写进了 6G 框架", e:"Sensing is written into the 6G frame", n:`
<p>前三页是技术和用途。这一页是<b>政治</b> —— 而且这页很重要,别跳。</p>
<h3>图在说什么</h3>
<p>ITU 在 2023 年发了 M.2160 建议书,定义了 IMT-2030(就是 6G 的官方框架),里面列了六个"使用场景"。<b>ISAC 是其中一个</b>,AI 与通信融合是另一个,还有四个。</p>
<div class="say">你们可能会想,标准组织写不写有什么关系?一个技术好就是好啊。<br><br>关系大了。一个东西被写进"使用场景",意味着三件事会为它发生:<b>分频谱、定性能指标、写测试流程</b>。<br><br>在 ISAC 被正式点名之前,<b>没有任何一台无线设备有义务是"可测量的"</b>。厂商可以说"我这个也能感知",但没人能验证,也没人必须支持。写进去之后,它从"某些人的研究方向"变成了"要交付的东西"。</div>
<h3>和前面课程的连接</h3>
<p>这跟我们讲 O-RAN 的时候是一个道理:一个接口只有被标准化了,你才能分开采购。同理,一个能力只有被标准化了,才有人真的去建。</p>
<div class="warn">2027 年之后的时间点(第 6 页那条时间轴)是<b>演讲者的预测</b>,不是 ITU 或 3GPP 发布的日程。这一页说 M.2160 是事实,那是真的;但不要把预测讲成已定的时间表。</div>
`},

{s:"台面", t:"被点名,钟就开始走", e:"Being named starts a clock", n:`
<p><b>这页挪到了第 5 页后面。</b>上一页说 ISAC 被写进了 M.2160;这一页回答"那什么时候能用" —— 被写进框架不等于有产品,它只是启动了一张时间表。页顶新加的那行小字就是这个引子,先念它。</p>

<p>时间轴,五个阶段。这一页要<b>明确标注哪部分是事实、哪部分是预测</b>。</p>
<h3>五段</h3>
<ul>
  <li><b>2020–23</b>:概念和用例</li>
  <li><b>2024–26</b>:3GPP Rel-19;试验</li>
  <li><b>2027–28</b>:频谱政策</li>
  <li><b>2029–30</b>(橙色):规范和认证</li>
  <li><b>2031+</b>(绿色):商用铺开</li>
</ul>
<div class="warn">这条时间轴<b>不是 3GPP 或 ITU 发布的日程</b>。<br><br>真实的部分:3GPP Release 19 里确实有 ISAC 的研究项目;ITU M.2160 确实把 ISAC 列为 IMT-2030 的使用场景之一。<br><br><b>2027 年往右全是演讲者的预测。</b>幻灯片上那行灰字已经写了这一点,你要念出来。</div>
<div class="say">我特意把这个界线说清楚,因为这是你们以后会反复遇到的情况。<br><br>技术路线图看起来都很权威 —— 有方框、有箭头、有年份。但里面往往一半是已发生的事,一半是猜的。<br><br>判断方法很简单:<b>问这个日期背后有没有一份文件</b>。Rel-19 有文件。2029 年认证没有。</div>
<h3>橙框那句值得展开一句</h3>
<p>"标准化就是权衡从一条曲线变成一个必须有人去认证的数字的地方。"</p>
<div class="say">这句话把整节课收了个口。<br><br>我们花了一小时讲这是一条曲线,你只能在上面选点。<br><br>但产品不能卖一条曲线。你要卖东西,就得说"我这个的测距精度是 X 米",然后有人拿仪器来验。<br><br>那个 X,就是有人在这条曲线上<b>替所有人选了一个点</b>,然后把它写进了标准。这是这节课的技术内容和第 5 页那个"委员会"接上的地方。</div>
`},

{s:"两个盒子", t:"两个盒子变成一个盒子", e:"Two boxes became one box", n:`
<p>这一节要把上一节的想法落到硬件上。左边:传统做法 —— 通信一套、雷达一套,各有各的频段和天线。右边:DFRC,<b>一条发射链</b>,比特出去、回波进来。</p>
<h3>DFRC 这个词</h3>
<p>Dual-Function Radar Communication,双功能雷达通信。学生第一次见,要念全称。</p>
<div class="say">左边那两个盒子,各自都很成熟,几十年的工程积累。把它们合成右边那一个盒子,<b>省下来的东西是实打实的</b>:一张频谱牌照、一个功放、一个天线面、一份功率预算。<br><br>但代价也是实打实的,而且这个代价是这节课剩下二十多页的全部内容 —— <b>一个波形,现在要同时满足两套规格</b>。<br><br>这就像让一个人同时当翻译和测量员。省了一个人的工资,但这个人现在很难做。</div>
<h3>节奏提示</h3>
<p>"What it buys / What it costs" 这两栏,一定要<b>都讲</b>。只讲省钱,学生会觉得这是白捡的便宜,后面讲权衡的时候就接不上了。这两栏是在为第 11–13 页那个 Pareto 前沿铺路。</p>
`},

{s:"两个盒子", t:"DFRC 是一个盒子,ISAC 是一个问题", e:"DFRC is one box. ISAC is the question.", n:`
<p>这一页在纠正一个学生一定会犯的混淆:<b>DFRC 和 ISAC 不是一回事</b>。</p>
<h3>关系是包含,不是等价</h3>
<ul>
  <li><b>DFRC</b>:在<b>一台</b>无线设备<b>里面</b>,共享波形、天线、处理链。是硬件层面的合并。</li>
  <li><b>ISAC</b>:范围更大。它还允许 <b>A 节点发射、B 节点接听</b> —— 发的和收的可以是两台设备、两个站址。</li>
</ul>
<div class="say">图上大橙框是 ISAC,里面那个小蓝框是 DFRC。所以:<br><br><b>每一个 DFRC 系统都是 ISAC,但不是每一个 ISAC 系统都装得进一个盒子。</b><br><br>为什么这个区别重要?因为如果发射和接收可以分开,你就可以让整个网络的所有基站<b>一起</b>形成一张感知的图。这个时候感知就不再是"某个基站的功能",而是"网络的功能"。</div>
<h3>可以顺口提一句</h3>
<p>分开收发在雷达界有个老名字叫 <b>bistatic radar</b>(双基地雷达),二战时期就有。不是新东西,新的是把它放在蜂窝网络里。这一句能让学生放松 —— 原来这些概念都有根。</p>
`},

{s:"两个盒子", t:"回波到底告诉你什么", e:"What an echo actually tells you", n:`
<p><b>这一页是全课的技术地基,绝对不能省。</b>后面讲冲突、讲 OFDM 格子怎么分,全靠这一页。这页原始演讲里没有,是专门加进来的。</p>
<h3>三个量,建议边讲边在黑板上画三个箭头</h3>
<ul>
  <li><b>时延(Delay)→ 距离</b>。公式 <code>R = cτ/2</code>。信号跑过去再跑回来,走了两倍距离,所以除以 2。c 是光速。</li>
  <li><b>多普勒(Doppler)→ 接近速度</b>。物体朝你来,回波频率偏高;离开你,偏低。就是救护车经过时鸣笛音调的变化,只不过用的是无线电。</li>
  <li><b>角度(Angle)→ 方向</b>。靠多根天线收到回波的<b>相位差</b>算出来。</li>
</ul>
<div class="say">τ 是时延,c 是光速,除以 2 是因为信号走了个来回。<br><br>多普勒你们都体验过 —— 救护车朝你开来的时候笛声尖,过去之后变闷。无线电波一模一样,只不过变化太小,人感觉不到,但接收机能算出来。</div>
<h3>下面那个问答是关键,别当装饰</h3>
<p>问:哪个旋钮买到更细的<b>距离</b>分辨率,哪个买到更细的<b>速度</b>分辨率?</p>
<ul>
  <li><b>带宽</b>买距离分辨率 —— 信号越宽,时间上的峰越尖,越能分开两个靠得近的目标。</li>
  <li><b>观测时间</b>买速度分辨率 —— 你必须盯得够久,相位才漂移出足够的差别。</li>
</ul>
<div class="warn">这两条一定要讲清楚,因为第 11 页"感知要宽带宽、通信要省带宽"那句冲突,学生只有知道<b>带宽是买来干什么用的</b>,才会觉得那个冲突是真冲突,而不是随口一说。</div>
`},

{s:"路标", t:"剩下的课只回答三个问题", e:"Three questions for the rest of today", n:`
<p><b>路标页(改写过)。</b>原来这里是"四个难点"清单,列了一堆后面根本不讲的东西(MIMO、射频硬件)。现在它就是接下来的目录,而且顺序和后面一模一样。</p>
<div class="say">前面讲清楚了三件事:雷达和基站要抢同一片天;一个信号可以同时干两份工;回波能告诉我们距离、速度、方向。剩下的课只回答三个问题:<br><br><b>一,为什么一个信号很难两头都好?</b>因为这两份工要的东西相反 —— 这会给我们一条"取舍曲线",而不是一个修好的答案。<br><br><b>二,那我们到底用哪个信号?</b>OFDM。Wi-Fi、4G、5G 已经在发的那个。不造新收音机。<br><br><b>三,怎么在比特和回波之间分这个信号?</b>OFDM 的格子就是一份预算,总得有人决定每个格子给谁。</div>
<div class="warn">后面每翻到一个新话题,先说一句"这是第几个问题"。学生的反馈就是"不知道现在在讲什么、跟上一页什么关系" —— 这一页就是治这个的。</div>
`},

{s:"权衡", t:"它们想要的东西相反 (1/2)", e:"They want opposite things (1/2)", n:`
<p><b>第一个问题:为什么一个信号很难两头都好。</b>路标页说好了三个问题;这一节三页一次讲完,后面不再绕回来讲冲突。</p>

<p>这一节是全课的<b>思想核心</b>。表格分成两页是因为十行放一页看不清,不是两个话题。</p>
<h3>五行,按列读再横着读一行</h3>
<table style="width:100%;border-collapse:collapse;font-size:14.5px;margin-bottom:12px">
<tr><th style="text-align:left;padding:5px;border-bottom:1px solid #ddd"></th><th style="text-align:left;padding:5px;border-bottom:1px solid #ddd;color:#de7a24">感知要</th><th style="text-align:left;padding:5px;border-bottom:1px solid #ddd;color:#2e5bba">通信要</th></tr>
<tr><td style="padding:5px"><b>频谱</b></td><td style="padding:5px">宽带宽,为了分辨率</td><td style="padding:5px">省带宽,为了速率</td></tr>
<tr><td style="padding:5px"><b>信号</b></td><td style="padding:5px">确定性波形</td><td style="padding:5px">随机的、载信息的符号</td></tr>
<tr><td style="padding:5px"><b>功率</b></td><td style="padding:5px">往目标上砸大功率</td><td style="padding:5px">每比特的功率效率</td></tr>
<tr><td style="padding:5px"><b>时间</b></td><td style="padding:5px">连续照射</td><td style="padding:5px">低时延的短突发</td></tr>
<tr><td style="padding:5px"><b>空间</b></td><td style="padding:5px">宽波束或扫描波束</td><td style="padding:5px">窄波束,一人一个</td></tr>
</table>
<h3>只要讲透一行,就讲"信号"那行</h3>
<div class="say">看第二行。这一行是整个矛盾的<b>数学根源</b>,其他四行都是它的表现。<br><br>通信要的信号是什么样?<b>随机的</b>。为什么?因为随机才携带信息 —— 如果我发的东西你能猜到,那我就没告诉你任何新东西。信息量的定义就是不可预测性。<br><br>雷达要的信号是什么样?<b>确定性的</b>。为什么?因为雷达要拿收到的回波去和它<b>原本发出去的东西</b>做相关。你必须精确知道自己发了什么,才能认出回来的是不是它。<br><br>所以:<b>随机性携带信息,同时毁掉干净的回波。</b><br><br>这一句话就是全部冲突。不是工程没做好,是两个需求在信息论层面上就朝着相反方向拉。</div>
<div class="warn">这一行讲不透,后面每一页学生都会觉得"那优化一下不就好了"。要让他们理解这是<b>原理性的</b>冲突,不是实现上的缺陷。</div>
`},

{s:"权衡", t:"它们想要的东西相反 (2/2)", e:"They want opposite things (2/2)", n:`
<p>后五行。同样别念完,挑两行。</p>
<h3>建议挑这两行</h3>
<ul>
  <li><b>Domain(域)</b>:感知要在距离和速度上分得细,通信要在时间和频率上切得细。两边都想要"更细的格子",只是方向不同 —— 而信号的总资源只有一份。</li>
  <li><b>Latency(时延)</b>:感知要低时延的跟踪反馈(你要实时知道那辆车在哪);而通信的很多业务其实<b>能容忍延迟</b>(视频缓冲、后台同步)。这一行有点反直觉 —— 学生一般以为通信才是急的那个。</li>
</ul>
<h3>下面那个问答是这一节的落点</h3>
<p>问:有没有一种设置让两者<b>同时</b>最优?</p>
<p><b>答:没有。</b>存在一条 <b>Pareto 前沿</b>(帕累托前沿):过了某个点之后,一方的每一点改善,都必须从另一方身上付账。设计工作是<b>选择坐在这条线的哪个位置</b>,而不是逃离这条线。</p>
<div class="say">我要你们记住这个词的态度,而不只是词本身。<br><br>工程里有两种问题。一种是"还没做好",努力就能变好。另一种是"结构上就这样",你只能<b>选</b>,不能<b>赢</b>。<br><br>ISAC 属于第二种。这节课后面的每一个设计,都不是在"解决"这个权衡 —— 它们都是在这条曲线上<b>挑了一个点,然后论证这个点挑得好</b>。</div>
`},

{s:"权衡", t:"前沿,画一次", e:"The frontier, drawn once", n:`
<p>上一页说了有条前沿,这一页把它画出来。<b>这张图后面会反复回来</b>(第 36、38 页),所以这里要讲到学生真的看懂。</p>
<h3>两根轴,而且横轴是反的</h3>
<ul>
  <li><b>纵轴</b>:可达速率(achievable rate)。<b>越高越好</b>,这个符合直觉。</li>
  <li><b>横轴:感知误差 —— 测出来的距离和速度离真值差多少。越小越好,所以越往右越差。</li>
</ul>
<div class="warn">这一页最大的教学陷阱:<b>学生看任何曲线图都默认"右上角最好"。这张图不是。</b><br><br>这张图的好角落在<b>左上</b>:速率高(上)+ 感知误差小(左)。<br><br>你必须<b>明确地说出来</b>,而且最好用手在屏幕上指一下左上角。不说,一半的学生会理解成相反的。</div>
<h3>为什么会有一条底线</h3>
<p>这条横轴在原论文里叫 CRLB(Cramér–Rao 下界),幻灯片上刻意没写这个缩写。只需要告诉学生一件事:给定这个信号、这个信噪比,不管算法多聪明,误差都不可能小于某个数 —— 物理划了一条地板线。所以曲线才会弯:越往左,每多挤出一点精度,付出的速率就越多。</p>
<div class="say">CRLB 不是某个算法的性能,是<b>物理和信息给你划的天花板</b> —— 或者说地板。它说的是:给定这个信号、这个信噪比,不管你用多神的算法,估出来的误差都不可能小于这个数。<br><br>所以当一篇论文说"我们逼近了 CRLB",意思是"我们的算法已经好到接近理论极限了,别再指望算法上能有大改进"。</div>
<h3>图上四个标注</h3>
<ul>
  <li><b>attainable frontier</b>:那条蓝线,能做到的最好组合。</li>
  <li><b>sensing-first</b>(绿点,靠左上):偏感知的设计点。</li>
  <li><b>comms-first</b>(橙点,靠右下):偏通信的设计点。</li>
  <li><b>unreachable / infeasible</b>:线外的两个区域,做不到。</li>
</ul>
<p>橙框那句是本节的总结,也是给后半节课定调:"后面每一个结果,都是关于这样一条曲线上某一个点的声明。"</p>
`},

{s:"波形", t:"第二个问题:我们到底用哪个信号?", e:"Question 2: which signal do we actually use?", n:`
<p><b>过渡页。</b>收第一个问题,提第二个问题,预告四个部分。四个部分的名字就是四个"为什么":为什么是点、为什么要很多波且垂直、为什么是 FFT、怎么拼成格子。念出来即可,别解释。</p>
<div class="say">第一个问题回答完了:两份工要的东西相反,所以有一条取舍曲线。那不管选哪个信号,它都得同时干两份工、落在曲线的某一点上。<br><br>第二个问题:到底用哪个信号?<br><br><b>答案是 OFDM</b> —— 正交频分复用,Wi-Fi、4G、5G 现在正在发的那个信号。不造新收音机。<br><br>但要把 OFDM 当雷达读,得先真正搞懂它。你们大多数人只听过名字,所以我们从地基开始,分四部分搭:收音机到底发什么、为什么它是一个"点";为什么要很多个波同时发、为什么必须互相垂直;为什么是 FFT;最后把发射机、接收机和格子拼起来。</div>
`},

{s:"波形", t:"收音机发的是波,不是比特", e:"A radio sends a wave, not bits", n:`
<p><b>第一部分第一页:先把"波"立起来。</b>学生对 0/1 很熟,对"天线发的是什么"没有概念。这页只讲一件事:波有两个旋钮。</p>
<div class="say">天线发不出 0 和 1。它发的是某个频率上的一个<b>波</b>。频率一定下来,这个波只剩两样东西可以改:<b>多高</b>(幅度),<b>从周期的哪儿开始</b>(相位)。图上蓝线是基准;橙线只有一半高;绿线一样高,但提前了四分之一个周期。<br><br>别的都被频率钉死了。所以要传信息,只能转这两个旋钮。</div>
<div class="warn">这页不要出现"载波""调制"这类词。就说"波"和"两个旋钮"。</div>
`},

{s:"波形", t:"两个旋钮就是一个点", e:"Two knobs are one point", n:`
<p><b>回答"点是什么"</b>——上一版最大的漏洞。这页把波和点画在一起:左边一个波,右边它对应的点。</p>
<div class="say">这个频率上任何一个波 —— 随便多高、随便从哪开始 —— 都能写成"x 份余弦加 y 份正弦"。左边橙色那条波就是 −1.5 份余弦加 1.5 份正弦。所以两个旋钮其实就是两个数,两个数就是一个<b>点</b> (x, y)。右边那个橙点,就是左边那条橙波。<br><br><b>一个点 = 一个波。</b>从现在起,看到一个点,脑子里想的是一条波。</div>
<div class="warn">不要推三角恒等式。"任何波都能写成余弦份数加正弦份数"直接给,学生接受这个陈述就够了。</div>
`},

{s:"波形", t:"比特来选点", e:"Bits pick the point", n:`
<p>现在才轮到比特。有了"点 = 波",这页顺理成章。</p>
<div class="say">事先约好 16 个允许的点,也就是 16 个允许的波。比特四个一组:1011、0010、1110、0001……每组点名一个点。收音机把那条波发一个<b>符号时间</b> T,然后换下一组的波。<br><br>接收方量出 (x, y),挑<b>最近的</b>允许点,读回四个比特。噪声会把量出来的点推偏一点(图上灰点),所以允许点之间不能太挤 —— 这就是为什么是 16 个,不是一万六千个。<br><br>这套约定叫 16-QAM,名字不重要,图重要。</div>
<p>橙框留下缺口:一个波每 T 只带 4 比特,太慢。第二部分解决它。</p>
`},

{s:"波形", t:"第二部分:一个波太慢 —— 那就用很多个", e:"Part 2: one wave is slow — so use many", n:`
<p>第二部分开场。先把"快 64 倍"的两条路摆出来,让学生自己觉得两条都行 —— 下一页才揭晓为什么所有人都选了 B。</p>
<div class="say">每 T 四个比特,离视频流差得远。要快 64 倍有两条路:<br><br><b>A:一个波,符号变短。</b>还是一个波,换点换得快 64 倍,符号时间从 T 变成 T/64。<br><br><b>B:64 个波同时发。</b>64 个不同频率,每个带自己的点,各发满 T,加起来发出去。<br><br>两条路速度一样。可 Wi-Fi、4G、5G 全都选了 B。下一页是原因,而且这个原因就是今天整节课的物理。</div>
`},

{s:"波形", t:"为什么不用一个快波?因为回波。", e:"Why not one fast wave? Echoes.", n:`
<p><b>这是"为什么用 OFDM"的真正答案</b>,也是这节课最重要的埋线:回波在这里是敌人,后半场它会变成雷达。</p>
<div class="say">无线电会反弹。你的信号有一份拷贝会从墙上、楼上弹回来,晚到一点 —— 多走 300 米就晚 1 微秒。<br><br>看图。A 是短符号:那份晚到的拷贝落在了<b>下一个</b>符号上面,是上一个符号的糊影盖住了现在这个 —— 垃圾。B 是长符号:同样的延迟,拷贝几乎全部落在<b>它自己</b>身上,只是让这条波高一点或矮一点,接收方一乘就修回来了。<br><br>所以我们用很多慢波,不用一个快波。这句话记住 —— 今天后面,这个回波就是雷达。</div>
<div class="warn">数字:300 米 ↔ 1 µs 是光速算的,准确。别说成"多径衰落"之类术语。</div>
`},

{s:"波形", t:"把 64 个波加起来发出去 —— 然后呢?", e:"Add 64 waves and send the sum — then what?", n:`
<p>提出接收端的问题。这页的作用是让学生真的觉得"从一团紫线里拆回 64 个点"看起来不可能 —— 这样"正交"出场才有分量。</p>
<div class="say">上面三条:波 1 带它的点,波 2 带它的点,波 3……一共 64 个。加起来,就是下面那条紫线 —— 天线发出去的就是它。<br><br>接收方拿到的<b>只有</b>紫线。它得从这一根弯弯曲曲的线里,把 64 个波各自的 (x, y) 都找回来 —— 一团东西里抠出 64 对数。光看这条线,像是没希望。<br><br>什么时候能从一堆波的和里把一个波单独拿出来?"正交"这个词回答的就是这个问题。</div>
`},

{s:"波形", t:"垂直坐标轴:读一个,不带上另一个", e:"Perpendicular axes: reading one ignores the other", n:`
<p>你惯用的比喻,现在有了明确的用途:解释"可分离"到底是什么条件。</p>
<div class="say">先看平面上的点。左边 x、y 垂直:把点沿着 y 滑动,它的 x 读数不变 —— 两个数互相独立,各读各的。右边 a、b 歪着:沿 b 移动,a 的读数也跟着变了 —— 两个数互相漏。<br><br>可分离 ⇔ 垂直。现在我们要把同样的想法搬到波上。</div>
`},

{s:"波形", t:"画出来:什么叫两个波垂直", e:"Perpendicular waves, drawn", n:`
<p><b>这页把"波的垂直"变成看得见的东西</b>,是第二部分的核心。两张图:左边 1 个周期 × 2 个周期,乘积正负面积抵消;右边 1 个周期 × 1.5 个周期,抵不掉。</p>
<div class="say">接收方要量"和里有多少波 1",做法是拿和去乘波 1,再在一个符号时间 T 里加起来。<br><br>左边:波 1 一个周期,波 2 两个周期。它们的乘积是下面绿色那条,上面的面积和下面的面积一样多 —— 加起来是零。也就是说量波 1 的时候,波 2 一点都没混进来。这就叫两个波<b>垂直</b>。<br><br>右边:波 2 只有 1.5 个周期。乘积上面多下面少,加起来不是零 —— 波 2 漏进了波 1 的读数里。<br><br>规律:在 T 里转整数个周期,垂直;转半个,漏。</div>
`},

{s:"波形", t:"垂直的那一家:频率是 k/T", e:"The perpendicular family: frequencies k/T", n:`
<p>把上一页的规律收成一句话,并第一次给出"子载波""间隔 1/T"和真实数字。间隔在这里是<b>结论</b>,不是参数。</p>
<div class="say">一个波在 T 里转整数个周期,当且仅当它的频率是 1/T 的整数倍。所以 1/T、2/T、3/T……这些波<b>两两垂直</b>。OFDM 用的就是这一家。每一个成员叫一个<b>子载波</b>,它们的间隔是 1/T —— 这不是设计选择,是推出来的结果。<br><br>真实数字:5G 的 T 约 67 微秒,所以子载波间隔 15 kHz(还有 30、60、120 kHz 的档);Wi-Fi 的 T 是 3.2 微秒,间隔 312.5 kHz。<br><br>现在我们知道用<b>哪</b> 64 个波了。第三部分:把它们加起来、再拆开的那台机器。</div>
`},

{s:"波形", t:"第三部分:我们需要两台机器", e:"Part 3: we need two machines", n:`
<p>第三部分开场:先说清楚我们要的是什么,再给它名字。FFT 在这里是被"需要"出来的,不是凭空掉下来的。</p>
<div class="say">发射端需要一台机器:把 64 个波按各自的量加起来。接收端需要另一台:从一个和里量出每个波有多少。<br><br>要让计算机干这事,先把每个波在 T 里采 64 个点 —— 一个波就变成一行 64 个数,64 个波就是一张 64×64 的表。<b>第二台机器就是这张表。</b>第一台是同一张表倒着用。<br><br>这张表有名字:FFT 矩阵。我们先看一个最小的。</div>
`},

{s:"波形", t:"两个波:2×2 的 FFT,带数字", e:"Two waves: the 2×2 FFT, with numbers", n:`
<p>用具体数字走一个来回,让"量"和"加"两台机器都真的转一次。</p>
<div class="say">机器二,量。两个波,各采两个点:平的 (1, 1),翻号的 (1, −1)。叠成两行。拿它去乘和 (3, 1):第一行给 4,第二行给 2 —— 这个和里有 4 份平波、2 份翻号波。两行点乘 1·1 + 1·(−1) = 0,垂直。<br><br>机器一,加。同一张表倒着用,除以 2:给它 (4, 2),它把 (3, 1) 重建出来。一个来回,什么都没丢 —— <b>正是因为</b>两行垂直。</div>
<p>橙框:FFT = 量每个波;IFFT = 把波加回去;垂直的行让来回精确。</p>
`},

{s:"波形", t:"四个波:4×4 的 FFT", e:"Four waves: the 4×4 FFT", n:`
<p>放大到四个波,并且当场验一对行的点乘,让学生看到 0 是算出来的,不是宣布的。</p>
<div class="say">四个波,频率 0、1/T、2/T、3/T,各采四个点。第 k 行就是频率 k/T 的波。里面的 j 是 √−1,它只干一件事:让波能<b>转</b>过它的周期,而不只是翻个号。<br><br>验一对:第 2 行对第 4 行 —— 其中一行把 j 变号,逐项相乘再加:1·1 + (−j)(−j) + (−1)(−1) + j·j = 1 − 1 + 1 − 1 = 0。零。换任何一对也是零。<b>每个波都跟其他波垂直</b>,和画出来的一样。<br><br>64×64 的表是同一个东西,大一点;4096×4096 也是。</div>
<div class="warn">j 不展开。学生追问就答"为了让波能旋转,不然只有正负两个方向"。</div>
`},

{s:"波形", t:"为什么 Fast 那个字母最重要", e:"Why 'Fast' is the important letter", n:`
<p>CS 学生的主场:复杂度。这页回答"为什么是 FFT 而不是随便一个矩阵乘法",顺带解释 OFDM 为什么到 1971 年才可行。</p>
<div class="say">拿一个信号去乘 N×N 的表,要 N² 次乘法。FFT 算出<b>一模一样</b>的答案,只要大约 N log₂N 次 —— 靠的是表的两半互为拷贝,可以复用。<br><br>看表:64 个波,4096 次对 384 次;4096 个波,一千六百八十万对四万九千,省 340 倍。<br><br>一部 5G 手机每个符号都要跑一次,一秒钟几万次,靠电池。用原始的表做不到。FFT 算法 1965 年发表,第一篇用它做 OFDM 的论文 1971 年 —— 不是巧合。</div>
`},

{s:"波形", t:"第四部分:发射机", e:"Part 4: the transmitter", n:`
<p>把三部分拼起来。这页只讲发射方向,一步一步。</p>
<div class="say">拿 256 个比特,切成 64 组四个,每组选一个点。第 k 个点放到频率 k/T 的波上 —— 第 k 个<b>子载波</b>。一次 IFFT 把 64 个波加成一段长 T 的信号:<b>一个符号</b>。发出去。然后下 256 个比特、下一个符号。<br><br>256 比特进,一个符号出 —— 是一个波能做的 64 倍。</div>
`},

{s:"波形", t:"接收机", e:"The receiver", n:`
<p>镜像的一页,并且把第二部分埋的回波钉子在这里轻轻碰一下 —— 只碰一下,不展开,留给雷达部分。</p>
<div class="say">收到的一段信号做一次 FFT,出来 64 对 (x, y),每个子载波一对 —— 干干净净,因为波两两垂直。每一对被噪声推偏了一点,吸到最近的允许点上,读四个比特。<br><br>"为什么不用一个快波"那页的回波也在这里面。它让每个子载波的点变大一点或转一点 —— 每个子载波乘一个修正,然后忘掉它。<b>或者不忘</b>:那个回波,就是 ISAC 雷达那一半要读的东西。<br><br>同样 64 个波,同一个 FFT,反过来读。</div>
`},

{s:"波形", t:"一个符号接一个符号:格子", e:"Symbol after symbol: the grid", n:`
<p>第二个问题的落点。格子在这里第一次以"我们自己搭出来的东西"出现,下一页把它当雷达看就顺了。</p>
<div class="say">每一列是一个符号,每一行是一个子载波。橙色那格:第 3 个子载波在第 3 个符号里 —— <b>一条波、一个符号时间、一个点、四个比特</b>。5G 把一格叫一个资源元(resource element)。基站调度就是发格子:这些给你,那些给你邻居。<br><br>这就是格子。每一台 OFDM 收音机 —— Wi-Fi、4G、5G —— 都是一台一个符号接一个符号地填格子、读格子的机器。<br><br>第二个问题回答完了:OFDM 是一张格子,每一格是一条波发一个符号时间。下一页,同一张格子,当雷达读。</div>
`},

{s:"波形", t:"OFDM 里面本来就藏着一个雷达", e:"OFDM already carries a radar inside it", n:`
<p><b>四页入门讲完了。</b>现在把学生刚亲手"搭"出来的那张格子,当雷达看。</p>

<p>波形这一节开始。第一个消息是好消息:<b>你不需要新东西就能开始</b>。</p>
<h3>左边那张格子图</h3>
<p>横轴是时间(一个个 OFDM 符号),纵轴是频率(一个个子载波)。每个小格子叫一个<b>资源元(RE)</b>。这张图学生在讲 5G 物理层那节课见过,提醒他们一句。</p>
<div class="say">OFDM 已经部署在 Wi-Fi、4G、5G、6G 里了,是最成熟的波形。<br><br>妙的地方在于:<b>这张格子本身就是一堆旋钮</b>。每个格子你都可以决定它装什么、用多大功率。既然如此,为什么不能让一部分格子装比特,一部分格子专门用来照亮目标?<br><br>而且子载波天生就能当雷达的频率通道用。<b>一个新的调制器都不用做。</b></div>
<h3>下面那个问答:那还剩什么要设计?</h3>
<p>问答改过了。以前这里问"为什么还要设计新波形",答案通向 OTFS/ODDM —— 那条线整个删了。现在问的是:<b>OFDM 已经够用了,那还剩什么要设计?</b></p>
<p>答:<b>哪些格子给比特、哪些格子给回波。</b>每一个交给感知的格子,都是从数据那里拿走的。这个选择就是剩下的整节课 —— 第三个问题。</p>
<div class="ask">如果 OFDM 已经够用,那我们还剩下什么要决定的?<br><br>(想引出的答案:格子怎么分。答出来就直接翻下一页 —— 那页标题就是"格子是预算"。)</div>
`},

{s:"资源分配", t:"格子就是预算", e:"The grid is the budget", n:`
<p><b>第三个问题,也是最后一个:怎么在比特和回波之间分格子。</b>四页。</p>

<p>前面讲的是"有个权衡",从这一节开始讲"<b>那具体怎么分</b>"。这是最工程的一节。</p>
<h3>图在说什么</h3>
<p>又是那张时间-频率格子,但现在<b>每个格子被涂了色</b>:蓝格子分给通信,橙格子分给感知。</p>
<h3>四个要点,建议这样串</h3>
<div class="say">一个 RE 就是一个格子,一个子载波在一个 OFDM 符号期间。<br><br>每个格子承载两样东西:<b>一个符号,和一份功率</b>。<br><br>所以资源分配是两步:<b>先决定这个格子归谁,再决定给它多少功率。</b><br><br>整节课的"预算"比喻就在这里 —— 这张格子就是你的钱,总量固定。给感知多一格,通信就少一格。没有第三个选择。</div>
<h3>两个缩写先埋下,后面要用</h3>
<ul>
  <li><b>RE</b> = Resource Element,资源元。</li>
  <li><b>PSLR</b> = Peak-to-SideLobe Ratio,峰值旁瓣比。下一页先用一张图讲清楚"峰"是什么,第 34 页用它当感知的评分。</li>
  <li><b>RoI</b> = Region of Interest,感兴趣区域。<b>第 35 页那个"几乎没有损失"的魔术全靠这个词</b>,现在先让学生见一面。</li>
</ul>
<p>这一节的数据来自 IEEE JSAC 2024 那篇跨域双功能 OFDM 波形设计。两种分法和"几乎没有损失"的结论都引自那篇论文。</p>
`},

{s:"资源分配", t:"先讲清楚什么是峰", e:"What a peak is, before we grade one", n:`
<p><b>新加的页。</b>下一页要用 PSLR 给感知打分,但"峰"、"旁瓣"、"杂波"以前从没定义过 —— 学生连一个信号的 peak 是什么都不知道,后面三页就全是空中楼阁。这页用一张图把三个词钉死。</p>
<h3>图怎么讲</h3>
<ul>
  <li><b>峰(peak)</b>:接收机拿着自己发过的波形副本,在回波上从左到右滑动做相关。滑到目标所在的时延,所有能量对齐相加,冒出一个尖 —— <b>那个尖就是目标</b>。</li>
  <li><b>旁瓣(sidelobes)</b>:峰两侧的小包。它们不是目标,是<b>我们自己波形的鬼影</b>,是选了这个波形形状要付的价。</li>
  <li><b>杂波(clutter)</b>:底下那条起伏的灰线,<b>所有没人要的回波</b> —— 地面、墙、雨。</li>
</ul>
<div class="say">一句话:峰是目标,旁瓣是自己吓自己,杂波是世界的背景音。<br><br>PSLR 就是一个诚实的问题:<b>真峰比最高的那个鬼影高多少?</b>高得多,目标一眼可见;差不多高,目标就被淹了。下一页给感知打分,用的就是这个数。</div>
<div class="warn">旁瓣和杂波别混为一谈:旁瓣是你自己的波形造成的,换个波形能压下去;杂波是世界给的,换什么波形都消不掉。</div>
`},

{s:"资源分配", t:"两份评分,在两个房间打分", e:"Two scores, graded in two rooms", n:`
<p>这一页解释:同一张格子,<b>被两个考官用两套完全不同的标准打分</b>。</p>
<h3>两个评分</h3>
<ul>
  <li><b>通信分</b>:可达速率,把所有分给通信的 RE 加起来。<b>在时间-频率域里量</b> —— 策略是"把比特放在信道好的地方"。</li>
  <li><b>感知分</b>:RoI 内的 PSLR —— <b>真峰比杂波高出多少</b>。<b>在距离和速度上量</b> —— 策略是"在目标真正会出现的地方,让峰立得高"。</li>
</ul>
<div class="say">PSLR 用大白话说:你想找的那个目标,它的回波峰值,比周围那些乱七八糟的杂波高出多少。高得多,就容易认出来;差不多高,就淹了。<br><br>关键在于最后那两句:<b>这两个分数不在同一个域里打。</b><br><br>通信分在时间和频率上打,感知分在距离和速度上打。这不是两个人对同一份卷子给了不同分数 —— 是<b>同一张格子被翻译成两种语言,然后各自批改</b>。<br><br>所以优化难在哪?你在一个域里动一下,另一个域里所有格子都跟着变。所以这个优化问题才难解。</div>
<p>橙框:"同一张格子被打两次分,由两个考官在两个不同的域里。" —— 这是这一页的记忆点。</p>
`},

{s:"资源分配", t:"谁先挑,谁赢", e:"Whoever picks first, wins", n:`
<p>这一页很好讲,因为它就是个<b>先后顺序</b>问题,学生秒懂。</p>
<h3>两种策略</h3>
<ul>
  <li><b>通信优先</b>:① 好格子先给比特 ② 再调剩下的功率 ③ 感知拿剩下的。<br><small style="color:#6b7280">结果:速率保持最优;PSLR 在 RoI 内"还不错"。</small></li>
  <li><b>感知优先</b>:① 先锁死 RoI 里的峰形 ② 再调格子上其余部分 ③ 比特拿剩下的。<br><small style="color:#6b7280">结果:PSLR 局部完美;速率<b>逼近</b>但不<b>达到</b>最优。</small></li>
</ul>
<div class="say">这就是分蛋糕先切的人占便宜。先挑的那一方拿到最优,后挑的拿剩下的。<br><br>注意措辞的差别,这个差别是真的:通信优先时速率是"<b>保持最优</b>",感知优先时速率是"<b>逼近</b>最优"。一个是等号,一个是约等号。</div>
<h3>下面那个问答是本节最精彩的地方,一定要讲</h3>
<p>问:两种设计都声称"几乎没有损失",这怎么可能?</p>
<p><b>答:因为约束只在 RoI 内部强制执行。</b>把"必须完美"的房间缩小,格子的其余部分就自由了,可以全给另一个功能。</p>
<div class="say">这是这节课最实用的一个思维方式,我希望你们带走。<br><br>"几乎没有损失"听起来像免费的午餐,像是有人绕过了我们刚才说躲不开的权衡。但没有人绕过它。<br><br>他们做的是:<b>把要求变窄了。</b><br><br>我不要求整张格子在所有距离、所有速度上都干净,我只要求那辆车可能出现的那一小块区域干净。那一小块之外,随便。于是那一大片就都能拿去发比特。<br><br>所以每次你在论文里看到"几乎没有损失",第一个要问的问题是:<b>你把要求缩到多小了?</b></div>
`},

{s:"收尾", t:"三件事带回家", e:"Three things to take home", n:`
<p><b>总结页(改写过)。</b>原来是一张对比几篇论文的表,现在是这节课的三个想法,按讲的顺序。</p>
<div class="say">三件事带回家。<br><br><b>一,一个波形,两份工。</b>基站本来就在发的信号会弹回来,那个回波就是没人上传过的测量数据。<br><br><b>二,两份工要的东西相反。</b>感知要宽、稳、可预测的信号;数据要高效、突发、随机的信号。所以有的是一条取舍曲线,没有"修好"这回事。<br><br><b>三,在 OFDM 上,选曲线上的哪个点,就是一个调度决定。</b>格子里哪些给比特、哪些给回波、谁先挑。</div>
<p>橙框那句就是这节课的一句话版本:<b>ISAC 不是一台新收音机,是对着现有收音机问了一个新问题 —— 每个格子给谁?</b>它和第 3 页那句("把网络自己的信号当雷达读")首尾呼应。</p>
`},

{s:"收尾", t:"什么其实还没完成", e:"What is actually unfinished", n:`
<p>诚实地划一条线:哪些已经能建了,哪些还没解决。</p>
<h3>两栏</h3>
<ul>
  <li><b>够成熟可以建了</b>(绿):权衡已经被理解;基于 OFDM 的 ISAC 确实能跑起来;资源格子可以被分配。</li>
  <li><b>还开着</b>(橙):杀手级应用;共享波形的安全性;用 AI 做波形设计;空-天-地一体化的覆盖。</li>
</ul>
<h3>下面那个问答是这节课最后一个思想点</h3>
<p>问:这四个里面,哪一个<b>不是</b>工程问题?</p>
<p><b>答:第一个。</b>波形可以被优化,<b>市场不能</b>。ISAC 现在是一个技术在找那个愿意为它付钱的应用。</p>
<div class="say">这一句我想让你们认真听。<br><br>后面三个 —— 安全、AI 波形、空天地 —— 都是难的工程问题。给足够的时间和人,会有进展。<br><br>第一个不是。"杀手级应用"不是一个能靠聪明解决的问题。<br><br>ISAC 现在的处境是:<b>一个技术上很漂亮、经济上还没找到买家的东西。</b>它能测距、能数人、能追手,但还没有哪一个场景大到能撑起在全网部署它的成本。<br><br>这跟我们讲运营商经济那节课是一回事:每一次架构变化都得有人算得过账。ISAC 的账,现在还没算清。<br><br>这不是说它会失败。5G 刚出来的时候大家也在找杀手级应用。但你们作为工程师要有这个意识:<b>技术成熟和技术被采用,是两件不同的事,后者往往由前者之外的原因决定。</b></div>
<p>SAGIN = Space–Air–Ground Integrated Network,空天地一体化网络。</p>
`},

{s:"收尾", t:"课堂作业:在曲线上选一个点", e:"Before you go: pick a point on the curve", n:`
<p>幻灯片顶上加了一行:两分钟、写在纸上、出门时交。学生之前不知道这页是干什么的 —— 先把规则念出来。</p>

<p>下课前收的小作业。图就是第 13 页那条前沿曲线,<b>故意画成空白的</b>,让学生自己标点。</p>
<h3>三道题</h3>
<ol>
  <li>标出<b>自动驾驶汽车</b>应该坐在哪。再标出<b>家里的 Wi-Fi</b> 应该坐在哪。</li>
  <li>说出这两个设计会<b>分配得不一样</b>的一种资源。</li>

`<p>So far in this course, the network has been doing one job: <b>moving bits from here to there</b>. Today is about something different. Today the network starts to <b>look at things</b>.</p>
<p>Everything we've done so far is about getting information out. Today I want to ask a different question: can the same signal that carries your data also tell us what the world outside looks like?</p>
<p>Those three words in the subtitle — waveforms, resource allocation, standards — those are our three stops. And by the end you'll see they're really <b>three versions of the same problem</b>.</p>`,

`<p>Take a look at these two machines. What do they have in common?</p>
<p><i>[Wait. Someone will say "antennas."]</i></p>
<p>Right, antennas. But there's something more important than that. <b>They want the same things.</b> Both of them want spectrum. Both want power. Both want antenna area. Both want silicon. And there is only one sky.</p>
<p>Here's why that matters, and it's not a technical reason — it's a money reason. Spectrum is bought at auction, it is extremely expensive, and you cannot make more of it. So if you build a radar system and a communication system separately, you are <b>paying for the same hardware twice</b>.</p>
<p>Remember what we said about carrier economics: every architecture change is somebody trying to serve more people for less money per person. This is that again. Except what's being saved here isn't base stations — it's <b>spectrum and antennas</b>.</p>`,

`<p>This is <b>the</b> slide. Everything else today is a consequence of this one. So let's go slowly.</p>
<p>Blue arrow, base station to phone: the signal goes out carrying bits. That's communication, you know that already.</p>
<p>Orange solid line: that same signal also lands on something. A car. A person. A wall.</p>
<p>Orange dashed line: and it <b>bounces back</b>. That dashed line is the entire new idea in this lecture.</p>
<p>Now notice — there is only <b>one transmission</b> here. We are not sending two signals, one for data and one for radar. It's the same signal. It's <b>information</b> on the way out, and it's <b>measurement</b> on the way back.</p>
<p>Put it another way. Your phone is downloading a video. That signal the base station sends is, at the same time, lighting up a car on the road. And the tiny bit of energy that comes back tells the base station where that car is and how fast it's moving. Nobody ever uploaded that car's position. Nobody consented, nobody installed an app.</p>
<p>So write this down: <b>ISAC does not add a radar to the network. It reads the network's own signal as radar.</b></p>`,

`<p>That was the how. Now the what-for.</p>
<p>I'm not going to read all six of these. Let me take three.</p>
<p><b>Cars.</b> An echo sees what a camera can't — fog, darkness, around a corner.</p>
<p><b>XR.</b> Track your hand with <b>nothing on your hand</b>. Right now VR needs either controllers or cameras watching you. ISAC just uses the echo off the Wi-Fi signal that's already in the room.</p>
<p><b>IoT.</b> Count how many people are in a room <b>with no camera</b>. Think about where that matters — a nursing home, a classroom.</p>
<p>Now, these six look like they have nothing to do with each other. Cars, VR, counting people, satellites, disaster response, farming. But they are <b>the same thing</b>: the network noticing something by itself, instead of waiting for an app to report it.</p>
<p>Every piece of location data on your phone right now got there because your phone <b>chose to upload it</b>. This is the opposite. The network just knows.</p>
<p><i>[Let that sit for a second. Don't resolve it — leave the discomfort with them.]</i></p>`,

`<p>The last three slides were engineering. This one is <b>politics</b>, and it matters more than it looks.</p>
<p>In 2023 the ITU published Recommendation M.2160. That document defines IMT-2030 — the official framework for 6G — and it lists six usage scenarios. <b>ISAC is one of them.</b></p>
<p>Now you might think, who cares what a standards body writes down? If a technology is good, it's good.</p>
<p>It matters a lot. Being named a usage scenario means three things start happening for you: <b>spectrum gets allocated, performance requirements get written, and test procedures get defined</b>.</p>
<p>Before ISAC was named, <b>no radio was obliged to be measurable</b>. A vendor could claim their box does sensing, but nobody could verify it and nobody had to support it. Once it's in the framework, it stops being somebody's research direction and becomes something you have to ship.</p>
<p>Same logic as O-RAN. An interface only becomes something you can buy separately once it's standardised. A capability only gets built once it's standardised.</p>`,

`<p>Last slide said ISAC was written into M.2160. Natural next question: so when does it arrive? Being named doesn't ship a product — it starts a schedule: spectrum, requirements, tests, then certification. Here is where that schedule stood when this material was prepared.</p>
<p>A timeline, five phases. And I'm going to be careful about which parts are facts.</p>
<p>2020 to 2023: concept and use cases. 2024 to 2026: 3GPP Release 19, and trials. 2027 to 2028: spectrum policy. 2029 to 2030: specifications and certification. 2031 onward: commercial rollout.</p>
<p>Now — <b>this is not a schedule published by 3GPP or the ITU.</b></p>
<p>What's real: Release 19 does contain ISAC study work. M.2160 does name ISAC as an IMT-2030 usage scenario. Those are documented.</p>
<p><b>Everything from 2027 rightward is a forecast.</b> It says so in grey at the bottom of the slide, and I'm reading it out loud on purpose.</p>
<p>I'm drawing that line clearly because you'll run into this constantly. Technology roadmaps all look authoritative — boxes, arrows, years. And usually half of it has happened and half of it is a guess. The test is simple: <b>ask whether there's a document behind the date.</b> Release 19 has a document. 2029 certification does not.</p>
<p>And one closing thought on this: <b>standardisation is where the tradeoff stops being a curve and starts being a number somebody has to certify.</b></p>
<p>We spent an hour saying this is a curve and you can only pick a point on it. But you can't sell a curve. To ship a product somebody has to say "the ranging accuracy of this device is X metres," and then somebody else shows up with instruments to verify it.</p>
<p>That X is somebody <b>choosing a point on this curve on behalf of everyone</b> and writing it into a standard. Which is where all of today's engineering meets that committee I mentioned at the start.</p>`,

`<p>Now let's put that idea into hardware.</p>
<p>Left side: the traditional way. Communication is one system, radar is another. Each has its own band, its own antenna.</p>
<p>Right side: DFRC — Dual-Function Radar Communication. <b>One transmit chain.</b> Bits out, echo in.</p>
<p>Those two boxes on the left are both mature. Decades of engineering in each. And when you merge them into that one box on the right, what you save is real: <b>one spectrum licence, one amplifier, one aperture, one power budget.</b></p>
<p>But the cost is also real, and that cost is the rest of this lecture. <b>One waveform now has to satisfy two specifications at the same time.</b></p>
<p>It's like asking one person to be both your translator and your surveyor. You saved a salary. That person now has a very hard job.</p>`,

`<p>I want to fix a confusion before it starts, because everybody makes this one.</p>
<p><b>DFRC and ISAC are not the same thing.</b></p>
<p>DFRC is <b>inside one radio</b>. Shared waveform, shared antennas, shared processing chain. It's a hardware merger.</p>
<p>ISAC is bigger. ISAC also allows <b>one node to transmit and a different node to listen</b>. The transmitter and the receiver can be two separate devices at two separate sites.</p>
<p>So: <b>every DFRC system is ISAC. Not every ISAC system fits in one box.</b></p>
<p>Why does that distinction matter? Because if transmit and receive can be separated, then <b>all the base stations in the network can build one sensing picture together</b>. At that point sensing stops being a feature of a base station and becomes a feature of the network.</p>
<p>By the way, separating transmit and receive is an old idea in radar. It's called <b>bistatic radar</b> and it goes back to World War Two. Nothing new about it. What's new is putting it inside a cellular network.</p>`,

`<p>This slide is the technical foundation for everything after it, so do not let me rush.</p>
<p>An echo gives you three things. I'm going to draw three arrows on the board.</p>
<p><b>Delay gives you range.</b> <span class="t">R = c·tau over 2</span>. Tau is the delay, c is the speed of light, and we divide by two because the signal made a round trip.</p>
<p><b>Doppler gives you closing speed.</b> Object coming toward you, the echo comes back at a higher frequency. Going away, lower. You've all heard this — an ambulance siren is high-pitched coming at you and drops as it passes. Radio waves do exactly the same thing. The shift is far too small for you to hear, but a receiver can compute it.</p>
<p><b>Angle gives you direction</b>, from the phase difference across multiple antennas.</p>
<p>Now the important part. Which knob buys you finer <b>range</b>, and which buys you finer <b>speed</b>?</p>
<p><i>[Let them try.]</i></p>
<p><b>Bandwidth buys range resolution.</b> A wider signal has a sharper peak in time, so you can separate two targets that are close together.</p>
<p><b>Observation time buys velocity resolution.</b> You have to watch long enough for the phase to drift by a measurable amount.</p>
<p>Hold on to those two, because in twenty minutes I'm going to tell you that sensing wants wide bandwidth and communication wants to conserve it. That conflict only feels real if you know <b>what the bandwidth was buying</b>.</p>`,

`<p>Before we go further, the map for the rest of today. Three questions, in the order we will answer them.</p>
<p><b>One: why can't a single signal be great at both jobs?</b> Because the two jobs want opposite things. That gives us a curve of compromises — not a fix.</p>
<p><b>Two: which signal do we actually use?</b> OFDM. The one Wi-Fi, 4G and 5G already transmit. We are not building a new radio.</p>
<p><b>Three: how do we share that signal between bits and echoes?</b> The OFDM grid is a budget, and somebody has to decide who gets each cell.</p>
<p>Everything from here is one of those three. If you ever lose the thread, ask me which question we're on.</p>`,

`<p>Question one from the roadmap: why can't one signal be great at both jobs? Three slides, all in one place.</p>
<p>This section is the intellectual core of the lecture. The table is split across two slides only because ten rows won't fit legibly on one — it's one table, one topic.</p>
<p>Five rows. Let's read the columns, then I'll take one row properly.</p>
<p>Row two. <b>Signal.</b> This row is the mathematical root of the whole conflict, and the other four are just symptoms of it.</p>
<p>What does communication want its signal to look like? <b>Random.</b> Why? Because randomness is what carries information. If you can predict what I'm about to send, I haven't told you anything new. Unpredictability <i>is</i> the definition of information content.</p>
<p>What does radar want its signal to look like? <b>Deterministic.</b> Why? Because radar correlates the echo it receives against <b>what it knows it sent</b>. You have to know your own transmission exactly to recognise it coming back.</p>
<p>So here it is: <b>randomness carries information, and randomness ruins a clean echo.</b></p>
<p>That one sentence is the whole conflict. This isn't sloppy engineering. These two requirements pull in opposite directions at the level of information theory.</p>`,

`<p>Second half of the table. Again, let me take two rows.</p>
<p><b>Domain.</b> Sensing wants fine steps in distance and speed; communication wants fine slots in time and frequency. Both want a finer grid — in different directions — and there is only one signal to cut up.</p>
<p><b>Latency.</b> Sensing wants low-latency tracking feedback — you need to know where that car is <i>now</i>. And a lot of communication traffic actually <b>tolerates</b> delay: video buffers, background sync. That one's a bit counterintuitive; most of you would assume communication is the impatient one.</p>
<p>So — is there a setting where both are optimal?</p>
<p><b>No.</b> What exists is a <b>Pareto frontier</b>. Past a certain point, every improvement in one is paid for out of the other. The design work is <b>choosing where to sit on the curve</b>, not escaping it.</p>
<p>I want you to take the attitude here, not just the word.</p>
<p>There are two kinds of problems in engineering. One kind is "we haven't got it right yet" — effort makes it better. The other kind is "this is structural" — you can only <b>choose</b>, you cannot <b>win</b>.</p>
<p>ISAC is the second kind. Every design in the rest of this lecture is not <i>solving</i> this tradeoff. Every one of them is <b>picking a point on this curve and then arguing the point was well chosen</b>.</p>`,

`<p>Last slide said there's a frontier. Here it is drawn. And this picture comes back four more times today, so let's make sure it lands.</p>
<p>Vertical axis: achievable rate. <b>Higher is better</b> — that one's intuitive.</p>
<p>Horizontal axis: sensing error — how far off the range and speed estimates are. <b>Lower is better</b>, which means <b>further right is worse</b>.</p>
<p>So say it with me: the good corner of this plot is <b>up and to the left</b>. <i>[Point at it.]</i> I'm making a point of this because every curve you've ever seen has "up and to the right" as good, and about half of you will read this backwards if I don't say it out loud.</p>
<p>In the paper this axis is a quantity called the CRLB. I'm deliberately keeping the acronym off the slide. The one thing to know: given this signal and this signal-to-noise ratio, no algorithm, however clever, gets the error below a certain floor. Physics sets that floor — and that's why the curve bends instead of running straight.</p>
<p>Green point, up and left: a sensing-first design. Orange point, down and right: a communication-first design. Both are on the frontier. Both are legitimate. They're different <b>choices</b>.</p>
<p>And that's the frame for the rest of the hour: <b>every result after this is a claim about one point on a curve like this one.</b></p>`,

`<p>Question one is answered: the two jobs want opposite things, so there is a curve of compromises. Whatever signal we pick has to carry <b>both</b> jobs and sit somewhere on that curve.</p>
<p>Question two: which signal do we actually use?</p>
<p><b>The answer is OFDM</b> — Orthogonal Frequency Division Multiplexing. The signal Wi-Fi, 4G and 5G already transmit, right now. We are not building a new radio.</p>
<p>But to read OFDM as a radar we need to understand it properly, and most of you have only heard the name. So we build it from the ground up, in four parts: what a radio actually sends and why that is a point; why we send many waves at once and why they must be perpendicular; why the FFT; and then transmitter, receiver, and the grid.</p>
<p><i>[Read the four parts. Don't explain them here.]</i></p>`,

`<p>Part one. Start with what an antenna can actually do.</p>
<p>An antenna cannot emit a zero or a one. It emits a <b>wave</b> at some frequency. And once the frequency is fixed, there are exactly two things about that wave you can still change: <b>how tall it is</b> — the amplitude — and <b>where in its cycle it starts</b> — the phase.</p>
<p>Look at the three curves. Blue is the reference. Orange is half as tall. Green is just as tall as blue but starts a quarter of a cycle early. Everything else about them is pinned down by the frequency.</p>
<p>Two knobs. If we want to send information, we turn the knobs.</p>`,

`<p>Now — what is a point? Because I'm going to draw dots for the rest of the hour, and you need to know what a dot is.</p>
<p>Here is a fact you can take on trust: any wave of our chosen frequency — any height, any starting point — can be written as "x parts of a cosine plus y parts of a sine". The orange wave on the left is minus one-and-a-half parts cosine plus one-and-a-half parts sine.</p>
<p>So the two knobs are really two numbers. And two numbers are a <b>point</b>, (x, y). The orange dot on the right <i>is</i> the orange wave on the left.</p>
<p><b>One point is one wave.</b> From now on, whenever you see a dot, think "a wave".</p>`,

`<p>Now the bits, finally.</p>
<p>Agree in advance on sixteen allowed points — sixteen allowed waves. Cut the bits into groups of four: 1011, 0010, 1110, 0001, and so on. Each group names one point. The radio sends that wave for one <b>symbol time</b>, T, then switches to the next group's wave.</p>
<p>The receiver measures x and y, snaps to the <b>nearest</b> allowed point, and reads four bits back. Noise nudges the measurement a little — that grey dot — so the allowed points can't sit too close together. That's why sixteen, not sixteen thousand.</p>
<p>The scheme has a name, 16-QAM. The name doesn't matter; the picture does.</p>
<p>And here's the problem: one wave carries four bits every T. That is slow. Part two is about sending more — a lot more — at the same time.</p>`,

`<p>Part two. Four bits per symbol time is nowhere near a video stream. Two ways to go 64 times faster.</p>
<p><b>Option A: one wave, shorter symbols.</b> Keep one wave, but switch points 64 times faster. The symbol time shrinks from T to T over 64.</p>
<p><b>Option B: 64 waves at once.</b> Use 64 different frequencies at the same time, each carrying its own point for the full time T. Add them all up and send the sum.</p>
<p>Both give you 64 times the bits. And every modern radio — Wi-Fi, 4G, 5G — chose B. The next slide is why, and the reason is the same physics this whole lecture is about.</p>`,

`<p>Radio bounces. A copy of your signal comes back off a wall or a building a little late — about one microsecond later for every 300 metres of extra path.</p>
<p>Top row, option A, short symbols. The late copy lands on the <i>next</i> symbol. So what the receiver sees is the current symbol with a smeared copy of the previous one on top. Garbage.</p>
<p>Bottom row, option B, long symbols. Same delay, but now the copy overlaps the <i>same</i> symbol almost entirely. All it does is make that wave a little taller or shorter — and a single multiply at the receiver undoes that.</p>
<p><b>Echoes are why we send many slow waves instead of one fast one.</b> Keep that sentence. Later today, that same echo becomes the radar.</p>`,

`<p>So here is the plan in a picture. Wave one carries its point. Wave two carries its point. Wave three — and so on, 64 of them. Add them up: the purple line at the bottom. That purple line is what the antenna actually sends.</p>
<p>The receiver gets <b>only</b> the purple line. And from that one squiggle it has to recover each wave's x and y — 64 pairs of numbers out of one wobbly curve. Look at it. That seems hopeless.</p>
<p>When can you pull one wave back out of a sum of many? That is exactly the question the word "orthogonal" answers.</p>`,

`<p>Let me answer it with a picture you already know.</p>
<p>A point on a plane. Left: x and y perpendicular. Slide the point along y — its x-reading doesn't move. The two numbers are independent; each can be read on its own.</p>
<p>Right: tilt the axes. Now move along b and the a-reading changes too. The two numbers leak into each other.</p>
<p>Separable means perpendicular. Now we need the same idea for waves.</p>`,

`<p>Here's how the receiver measures "how much of wave one is in the sum": multiply the sum by wave one, then add up over the symbol time T.</p>
<p>Left picture. Wave one does one cycle in T, wave two does two. Their product is the green curve below — and look: the area above the line equals the area below. Add it up: zero. Measuring wave one picks up <b>nothing</b> of wave two. That is what it means for two waves to be <b>perpendicular</b>.</p>
<p>Right picture. Wave two does one and a half cycles. Now the product has more above than below — it does not add to zero. Wave two leaks into the reading of wave one.</p>
<p>So the rule: whole cycles in T, perpendicular. Fractional cycles, leak.</p>`,

`<p>A wave fits a whole number of cycles into T exactly when its frequency is a multiple of one over T. So the waves at one over T, two over T, three over T, and so on are <b>all perpendicular to each other</b>. That is the family OFDM uses. Each member is called a <b>subcarrier</b>, and their spacing is one over T — not a design choice, a consequence.</p>
<p>Real numbers. In 5G, T is about 67 microseconds, so the subcarriers are 15 kilohertz apart; there are also 30, 60 and 120 kilohertz variants. In Wi-Fi, T is 3.2 microseconds and the spacing is 312.5 kilohertz.</p>
<p>We now know <i>which</i> 64 waves to use. Part three: the machine that adds them up and takes them apart.</p>`,

`<p>Part three. Before I say the letters F-F-T, let me say what we need.</p>
<p>The transmitter needs a machine that takes 64 amounts and adds up the 64 waves with those amounts. The receiver needs a machine that takes a sum and measures how much of each wave is in it.</p>
<p>To do either in a computer, sample each wave at 64 instants during T. A wave becomes a row of 64 numbers; 64 waves become a 64-by-64 table. <b>Machine two is that table.</b> Machine one is the same table run backwards.</p>
<p>That table has a name: the FFT matrix. Let's look at a tiny one.</p>`,

`<p>Two waves, two samples each. A flat one: one, one. A flipping one: one, minus one. Stack them as rows.</p>
<p>Machine two — measure. Multiply the table into the sum three, one. Row one gives four, row two gives two. So the sum contains four units of the flat wave and two of the flipping one. And the rows are perpendicular: one times one plus one times minus one is zero.</p>
<p>Machine one — add. Same table, run backwards, divide by two. Give it four, two — it rebuilds three, one. Round trip complete, nothing lost. And it's exact <i>because</i> the rows are perpendicular.</p>
<p>So: FFT measures each wave. IFFT adds the waves back. Perpendicular rows are what make the round trip exact.</p>`,

`<p>Four waves now — frequencies zero, one over T, two over T, three over T — each sampled at four instants. Row k is the wave at frequency k over T. The j's, square root of minus one, are there for one reason: so a wave can <i>rotate</i> through its cycle instead of merely flipping sign.</p>
<p>Let's check one pair rather than take it on faith. Row two against row four: flip the sign of j in one of them, multiply entry by entry, add. One, minus one, one, minus one. Zero. Try any other pair — also zero. <b>Every wave is perpendicular to every other</b>, exactly as the drawing promised.</p>
<p>The 64-by-64 table is the same thing, bigger. So is the 4096-by-4096 one.</p>`,

`<p>Now the letter that matters: F, for fast.</p>
<p>Multiplying a signal by an N-by-N table costs N-squared multiplications. The FFT gets the <b>identical</b> answer in about N log N — by noticing that the two halves of the table are copies of each other and reusing them.</p>
<p>Look at the numbers. 64 waves: four thousand versus 384. 4096 waves: sixteen million versus forty-nine thousand. A 340-fold saving.</p>
<p>A 5G phone does this for every symbol, tens of thousands of times a second, on a battery. With the plain table it could not. The FFT algorithm was published in 1965; the first paper proposing OFDM built on it is from 1971. That is not a coincidence.</p>
<p>OFDM is practical <i>because</i> the FFT is fast. Part four: put the pieces together.</p>`,

`<p>Part four, the transmitter, one step at a time.</p>
<p>Take 256 bits. Cut them into 64 groups of four; each group picks a point. Put point k on the wave at frequency k over T — on <b>subcarrier</b> k. One IFFT adds the 64 waves into a single burst of length T: the <b>symbol</b>. Send it. Then the next 256 bits, the next symbol, and so on.</p>
<p>256 bits in, one symbol out — 64 times what a single wave could do.</p>`,

`<p>And the receiver is the mirror image.</p>
<p>One FFT on the received burst, and out come 64 pairs of x and y, one per subcarrier — cleanly, because the waves are perpendicular. Each pair has been nudged by noise; snap it to the nearest allowed point and read four bits.</p>
<p>One more thing is in that burst: the echo from the "why not one fast wave" slide. It makes each subcarrier's point a little larger or a little rotated. The receiver applies one correction per subcarrier and forgets it. <i>Or</i> it keeps it — because that echo is exactly what the radar half of ISAC reads.</p>
<p>Same 64 waves, same FFT, read the other way round.</p>`,

`<p>And here is where question two lands.</p>
<p>Each column is one symbol; each row is one subcarrier. The orange cell is subcarrier three during symbol three: <b>one wave, one symbol time, one point, four bits</b>. 5G calls a cell a <b>resource element</b>. A base station schedules by handing out cells — these to you, those to your neighbour.</p>
<p>This is the grid. Every OFDM radio — Wi-Fi, 4G, 5G — is a machine for filling this grid and reading it, symbol after symbol.</p>
<p>Question two answered: OFDM is a grid of cells, each one a wave for one symbol. Next slide: the same grid, read as a radar.</p>`,

`<p>Four slides of primer done — you just built that grid yourselves. Now read the very same grid as a radar.</p>
<p>Waveforms. And the first piece of news is good news: <b>you don't need anything new to start.</b></p>
<p>This grid — you've seen it before, in the physical layer lecture. Horizontal axis is time, one OFDM symbol per column. Vertical is frequency, one subcarrier per row. Each little cell is a <b>resource element</b>.</p>
<p>OFDM is already deployed in Wi-Fi, 4G, 5G, 6G. It is the most mature waveform we have.</p>
<p>And here's the neat part: <b>that grid is already a set of knobs.</b> For every cell you get to decide what goes in it and how much power it gets. So — why not let some cells carry bits and some cells be there purely to light up a target? The subcarriers naturally double as radar frequency bins. <b>You don't have to build a new modulator at all.</b></p>
<p>Which raises the obvious question: if OFDM is already good enough, what's left to design?</p>
<p>This: <b>which cells go to bits and which go to echoes.</b> Every cell you hand to sensing is a cell you took from data. That decision is the rest of this lecture — question three from the roadmap.</p>
<p><i>[Let them answer. Then turn the page — the next title is literally "the grid is the budget".]</i></p>`,

`<p>Question three, the last one: how do we share the grid between bits and echoes? Four slides.</p>
<p>Up to now we've said there's a tradeoff. From here we ask: <b>so how do you actually divide things up?</b> This is the most hands-on section of the day.</p>
<p>Same grid as before, except now <b>every cell is coloured</b>. Blue cells go to communication, orange cells to sensing.</p>
<p>One RE is one cell: one subcarrier during one OFDM symbol. Each cell carries two things — <b>a symbol and an amount of power</b>. So allocation is two decisions: <b>first who gets the cell, then how much power it gets.</b></p>
<p>This is where the budget metaphor comes from. That grid is your money, and the total is fixed. One more cell for sensing is one fewer cell for bits. There's no third option.</p>
<p>Three acronyms to plant now because we need them shortly. <b>RE</b>, resource element. <b>PSLR</b>, peak-to-sidelobe ratio — that'll be our sensing score. And <b>RoI</b>, region of interest. Remember that last one especially; a few slides from now it's going to explain a magic trick.</p>`,

`<p>Before anything gets graded, three words and one picture. The next slide grades sensing with a number called PSLR — and that number means nothing until you know what a peak is.</p>
<p>Here's what the receiver actually does. It keeps a copy of the waveform it transmitted, and it slides that copy along the echo, asking at every delay: how well do you line up? At the delay where a target sits, everything lines up at once and adds — and you get that tall spike. <b>The spike is the peak. The peak is the target.</b></p>
<p>The two smaller bumps beside it are <b>sidelobes</b>. They are not targets. They're ghosts of our own waveform — the price of the transmit shape we chose.</p>
<p>And the low wobbly floor is <b>clutter</b>: every echo we never asked for. The ground. Walls. Rain.</p>
<p>So PSLR — peak-to-sidelobe ratio — is one honest question: <b>how far does the true peak stand above the tallest ghost?</b> Stands tall, the target is unmissable. Stands level, the target is buried.</p>
<p>And keep the two failure modes apart: sidelobes are self-inflicted — a better waveform pushes them down. Clutter is the world's fault — no waveform removes it.</p>`,

`<p>Same grid, but it gets <b>graded twice, by two examiners using completely different standards</b>.</p>
<p><b>Communication score:</b> achievable data rate, summed over every RE assigned to communication. Measured in <b>time-frequency</b>. The strategy is: put bits where the channel is good.</p>
<p><b>Sensing score:</b> PSLR inside the region of interest — <b>how far the true peak stands above the clutter</b>. Measured in <b>distance and speed</b>. The strategy is: make the peak stand tall where the targets actually are.</p>
<p>PSLR in plain language: the thing you're looking for produces a peak, and there's junk all around it. How much higher is your peak than the junk? A lot higher, easy to find. About the same, it's buried.</p>
<p>Now the crucial bit is those last two lines. <b>These two scores are not graded in the same domain.</b></p>
<p>This isn't two people giving different marks to the same exam. It's <b>the same grid translated into two different languages and marked separately in each</b>.</p>
<p>So why is the optimisation hard? Because when you change one thing in one domain, <b>everything</b> in the other domain moves. That's what "non-convex" meant back on the challenges slide.</p>`,

`<p>This one's easy, because it's just a question of who goes first.</p>
<p><b>Communication-centric:</b> give the good REs to bits, then tune the leftover powers, and sensing takes the remainder. Result: rate stays optimal, and PSLR is merely <i>good</i> inside the RoI.</p>
<p><b>Sensing-centric:</b> lock the peak shape inside the RoI first, then tune the rest of the grid, and bits take the remainder. Result: PSLR is locally perfect, and rate <i>approaches</i> optimal without reaching it.</p>
<p>It's cake. Whoever cuts first does better. And notice the wording difference is real: one design <b>keeps</b> the optimal rate, the other <b>approaches</b> it. One is an equals sign, the other is an approximately-equals.</p>
<p>Now — both designs claim "almost no loss." How can that be?</p>
<p><i>[Let them think.]</i></p>
<p><b>Because the constraint is only enforced inside the region of interest.</b> Narrow the room you have to be perfect in, and the rest of the grid is free for the other function.</p>
<p>This is the most useful habit of mind in the whole lecture, so I'll say it slowly.</p>
<p>"Almost no loss" sounds like a free lunch. It sounds like somebody got around the tradeoff we just spent ten minutes saying is inescapable. Nobody got around it.</p>
<p>What they did was <b>make the requirement smaller</b>. I don't need a clean echo at every distance and every speed. I only need the little patch where that car might be. Outside that patch, I don't care. And now that big region is available for bits.</p>
<p>So every time you read "almost no loss" in a paper, the first question is: <b>how small did you make the requirement?</b></p>`,

`<p>Three things to take home, in the order we met them.</p>
<p><b>One waveform, two jobs.</b> The signal a base station already sends comes back as an echo, and that echo is measurement nobody had to upload.</p>
<p><b>The two jobs want opposite things.</b> Sensing wants a wide, steady, predictable signal; data wants an efficient, bursty, random one. So what you get is a curve of compromises — not a fix.</p>
<p><b>On OFDM, picking a point on that curve is a scheduling decision.</b> Which cells carry bits, which carry echoes, and who picks first.</p>
<p>So here is the whole lecture in one sentence. <b>ISAC is not a new radio. It's a new question asked of the radio we already have: who gets each cell?</b></p>`,

`<p>Let me draw an honest line between what's ready and what isn't.</p>
<p>Settled enough to build: the tradeoff is understood, OFDM-based ISAC works, and the RE grid can be allocated.</p>
<p>Still open: a killer application; security of a shared waveform; AI for waveform design; and space-air-ground reach.</p>
<p>Now — which of those four is <b>not</b> an engineering problem?</p>
<p><i>[Let them answer. Some will say security.]</i></p>
<p><b>The first one.</b> A waveform can be optimised. <b>A market cannot.</b> ISAC is a technology looking for the application that pays for it.</p>
<p>I want you to take this one seriously.</p>
<p>The last three — security, AI waveforms, space-air-ground — those are hard engineering problems. Give them time and people and they'll move.</p>
<p>The first one won't move that way. "Killer application" is not a problem you solve by being clever.</p>
<p>Where ISAC is right now: <b>technically elegant, and economically still looking for a buyer.</b> It can range, it can count people, it can track a hand. But no single use case is yet big enough to justify the cost of deploying it across a whole network.</p>
<p>Which is the same conversation we had about carrier economics: every architecture change needs somebody for whom the numbers work. For ISAC, those numbers aren't in yet.</p>
<p>That doesn't mean it fails. Nobody could name 5G's killer app when 5G launched either. But as engineers you should carry this awareness: <b>a technology maturing and a technology being adopted are two different events, and the second one is usually decided by things outside the technology.</b></p>`,

`<p>Two minutes, on paper, handed in on the way out — so I can see what actually landed.</p>
<p>Before you go. Same frontier curve as before, except I've left it blank, and you're going to mark it up.</p>
<p>One: mark where a <b>self-driving car</b> should sit. Then mark where a <b>home Wi-Fi link</b> should sit.</p>
<p>Two: name one resource the two designs would allocate differently.</p>
<p>Three: in one sentence — <b>what does sensing cost the bits in your example?</b></p>
<p>And to be clear: <b>"both" is not an answer to part three.</b> The entire point of today is that you cannot have both. If your instinct is to write "both," go back and look at the frontier again.</p>
<p>Two things before you hand it in: <b>a marked point, and one sentence.</b> Not a paragraph. One point, one sentence. Because if you actually understand it, one sentence is enough — and if you've written three paragraphs and still haven't said it, you don't have it yet.</p>`,

`<p><i>[Backup slide — not in the planned seventy-five minutes.]</i></p>
<p>All the acronyms from today are collected here. Don't go searching online for them, they're on this slide.</p>
<p>The density of acronyms in this material is genuinely high, and I know that. But let me say one thing: <b>I will not examine you on what the letters stand for.</b> What I care about is that you know what PSLR measures and why the region of interest makes "almost no loss" possible — not whether you can recite the words.</p>
<p>Notice the table is grouped by area: system, waveform, and so on. That grouping is doing real work — it tells you these acronyms <b>live at different layers</b>. They're not one flat pile of jargon.</p>`,

`<p><i>[Backup slide.]</i></p>
<p>Every quantity behind every plot today, in one place.</p>
<p>If somebody asks whether these need memorising — the first two you should recognise, because they tell you where the physics is.</p>
<p><span class="t">R = c·tau over 2</span> tells you why measuring distance is really measuring time.</p>
<p><span class="t">log base 2 of (1 + SINR)</span> tells you why interference eats rate directly — the interference is <b>in the denominator</b>. That's the mathematical form of "interference is mutual".</p>
<p>For the sensing-error floor, knowing the direction is enough: more bandwidth, more power, or a longer look all push the floor down. More signal, less error. That one matches intuition.</p>`,

`<p>Last slide. Today's material comes from Professor Zhu Han's ISAC talk at the University of Houston, plus the one paper behind the allocation section.</p>
<p>The cross-domain OFDM work is IEEE JSAC 2024 — that was our resource allocation section. And ITU-R M.2160 is the framework document.</p>
<p>One last thing before you go. If anything today made you want to dig further, I'd point you at <b>the phrase "almost no loss" on the allocation slide</b>.</p>
<p>Every time a paper says it, ask one question: <b>how small did you make the requirement?</b> That question alone is enough to read this literature critically. The problem is real, and the door is still open.</p>`
];

const img=document.getElementById('slide'), note=document.getElementById('note'),
      cnt=document.getElementById('count'),
      bar=document.querySelector('#prog>i'), right=document.getElementById('right');
let i=0, buf='', bufT=0, mode='en';

function pad(n){return String(n).padStart(2,'0')}

function draw(){
  const d=S[i], en=(mode==='en');
  img.src='pages/p-'+pad(i+1)+'.png';
  img.alt=en?d.e:d.t;
  cnt.textContent=(i+1)+' / '+S.length;
  bar.style.width=((i+1)/S.length*100)+'%';
  // Never mix the two: the English view is English throughout, title included.
  note.innerHTML = en
    ? '<h2>'+d.e+'</h2>'
      +'<div id="script"><h3 class="hdr">SAY THIS IN CLASS</h3>'+(EN[i]||'')+'</div>'
    : '<h2>'+d.t+'</h2>'+d.n;
  right.scrollTop=0;
  try{localStorage.setItem('isac-note-page',i)}catch(e){}
}

// ---- language switch: English or Chinese, never both ----
function setLang(m){
  mode = (m==='zh') ? 'zh' : 'en';
  document.body.classList.toggle('only-en', mode==='en');
  document.body.classList.toggle('only-zh', mode==='zh');
  document.documentElement.lang = (mode==='en') ? 'en' : 'zh-CN';
  document.title = (mode==='en') ? 'Class 5 ISAC · Speaker Notes' : 'Class 5 ISAC · 讲稿';
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));
  try{localStorage.setItem('isac-note-lang',mode)}catch(e){}
  draw();
}
document.querySelectorAll('#lang button').forEach(b=>{
  // blur, or the button keeps focus and Space/Enter re-triggers it instead of paging
  b.addEventListener('click',()=>{setLang(b.dataset.m); b.blur();});
});
let lang='en';
try{ lang=localStorage.getItem('isac-note-lang')||'en'; }catch(e){}
setLang(lang);  // anything other than 'zh' (including the old 'both') lands on English

function go(n){ i=Math.max(0,Math.min(S.length-1,n)); draw(); }

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){
    e.preventDefault(); go(i+1);
  } else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='Backspace'){
    e.preventDefault(); go(i-1);
  } else if(e.key==='Home'){ e.preventDefault(); go(0); }
  else if(e.key==='End'){ e.preventDefault(); go(S.length-1); }
  else if(/^[0-9]$/.test(e.key)){
    const now=Date.now();
    buf = (now-bufT<1200) ? buf+e.key : e.key;
    bufT=now;
    const n=parseInt(buf,10);
    if(n>=1&&n<=S.length) go(n-1);
  }
});

// click the slide to advance
document.getElementById('left').addEventListener('click',()=>go(i+1));

let start=0;
try{ const v=localStorage.getItem('isac-note-page'); if(v!==null) start=parseInt(v,10)||0; }catch(e){}
go(start);
</script>
