<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 5 · 打破架构图 · 讲稿</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1a1f26; --muted:#6b7280;
    --line:#e3e6ea; --blue:#2e5bba; --orange:#de7a24; --purple:#6d3597;
    --green:#498b4a; --red:#b22c2c; --hl:#fff8e6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
    font-size:16px; line-height:1.85; overflow:hidden;
  }

  /* ---- top bar ---- */
  #bar{
    height:46px; display:flex; align-items:center; gap:14px;
    padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  #bar b{font-size:14px; color:var(--blue); letter-spacing:.02em; white-space:nowrap}
  #sec{
    font-size:12.5px; color:var(--muted); padding:2px 9px;
    border:1px solid var(--line); border-radius:99px; white-space:nowrap;
  }
  #count{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  #prog{height:3px; background:var(--line)}
  #prog>i{display:block; height:100%; background:var(--blue); width:0; transition:width .18s}

  /* ---- layout ---- */
  #wrap{display:flex; height:calc(100% - 49px)}
  #left{
    flex:0 0 54%; display:flex; align-items:center; justify-content:center;
    padding:20px; background:#eceef1;
  }
  #left img{
    max-width:100%; max-height:100%; border-radius:6px;
    box-shadow:0 3px 16px rgba(20,35,60,.18); background:#fff; cursor:pointer;
  }
  #right{
    flex:1; overflow-y:auto; padding:26px 32px 90px;
    background:var(--panel); border-left:1px solid var(--line);
  }

  /* ---- notes typography ---- */
  h2{margin:0 0 4px; font-size:20px; line-height:1.4; color:#132b52}
  .en{margin:0 0 18px; font-size:13px; color:var(--muted); font-family:Georgia,serif; font-style:italic}
  h3{
    margin:22px 0 8px; font-size:14px; color:var(--blue);
    padding-left:9px; border-left:3px solid var(--blue);
  }
  p{margin:0 0 12px}
  ul,ol{margin:0 0 12px; padding-left:1.4em}
  li{margin-bottom:7px}
  b{color:#0d2340}
  .say{
    background:var(--hl); border-left:3px solid var(--orange);
    padding:12px 15px; margin:0 0 14px; border-radius:0 5px 5px 0;
  }
  .say:before{
    content:"课上这样说"; display:block; font-size:11.5px; color:var(--orange);
    letter-spacing:.1em; margin-bottom:5px; font-weight:700;
  }
  .warn{
    background:#fdf2f2; border-left:3px solid var(--red);
    padding:12px 15px; margin:0 0 14px; border-radius:0 5px 5px 0; font-size:15px;
  }
  .warn:before{
    content:"别讲错"; display:block; font-size:11.5px; color:var(--red);
    letter-spacing:.1em; margin-bottom:5px; font-weight:700;
  }
  .ask{
    background:#f0f5ff; border-left:3px solid var(--blue);
    padding:12px 15px; margin:0 0 14px; border-radius:0 5px 5px 0; font-size:15px;
  }
  .ask:before{
    content:"问学生"; display:block; font-size:11.5px; color:var(--blue);
    letter-spacing:.1em; margin-bottom:5px; font-weight:700;
  }
  .term{
    background:#f7f4fb; border-left:3px solid var(--purple);
    padding:12px 15px; margin:0 0 14px; border-radius:0 5px 5px 0; font-size:15px;
  }
  .term:before{
    content:"术语 · 先弄懂再上台"; display:block; font-size:11.5px; color:var(--purple);
    letter-spacing:.1em; margin-bottom:5px; font-weight:700;
  }
  .term ul{margin:6px 0 0}
  code{
    background:#f0f2f5; padding:1px 5px; border-radius:3px;
    font-family:Consolas,monospace; font-size:14px; color:#8b3a00;
  }
  .t{font-family:Consolas,monospace; font-size:14.5px; color:var(--purple)}
  table.n{width:100%; border-collapse:collapse; font-size:14.5px; margin:0 0 14px}
  table.n th{text-align:left; padding:5px; border-bottom:1px solid #ddd; font-size:13px}
  table.n td{padding:5px; vertical-align:top; border-bottom:1px solid #f0f0f0}

  /* ---- English spoken script ---- */
  #script{
    margin-top:30px; padding:20px 22px 6px;
    background:#f4f8f4; border:1px solid #cfe0cf; border-radius:7px;
    font-family:Georgia,"Times New Roman",serif; font-size:16.5px; line-height:1.78;
  }
  #script>h3.hdr{
    margin:0 0 14px; padding:0 0 10px 0; border:0; border-bottom:1px solid #cfe0cf;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    font-size:13px; color:var(--green); letter-spacing:.08em;
  }
  #script p{margin:0 0 13px}
  #script b{color:#123312}
  #script i{color:#5f7a5f; font-size:15.5px}

  /* language toggle */
  #lang{display:flex; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden}
  #lang button{
    border:0; background:#fff; color:var(--muted); cursor:pointer;
    font-family:inherit; font-size:12.5px; padding:4px 11px; border-left:1px solid var(--line);
  }
  #lang button:first-child{border-left:0}
  #lang button.on{background:var(--blue); color:#fff}
  /* EN mode keeps the headings so you still know which slide you are on. */
  body.only-en #note>*:not(#script):not(h2):not(.en){display:none}
  body.only-en #script{margin-top:12px}
  body.only-zh #script{display:none}

  /* ---- footer hint ---- */
  #hint{
    position:fixed; bottom:0; right:0; left:54%;
    padding:9px 32px; font-size:12px; color:var(--muted);
    background:linear-gradient(transparent,var(--panel) 45%);
    border-left:1px solid var(--line);
  }
  kbd{
    background:#fff; border:1px solid #c8cdd4; border-bottom-width:2px;
    border-radius:4px; padding:1px 6px; font-size:11px; font-family:inherit; color:#333;
  }

  @media (max-width:900px){
    body{overflow:auto}
    #wrap{flex-direction:column; height:auto}
    #left{flex:none; padding:12px}
    #right{border-left:none; border-top:1px solid var(--line); padding:20px 18px 70px}
    #hint{left:0}
  }
</style>
</head>
<body>

<div id="bar">
  <b>Class 5 · 打破架构图</b>
  <span id="sec"></span>
  <span id="lang">
    <button data-m="both" class="on">双语</button>
    <button data-m="zh">中文</button>
    <button data-m="en">EN</button>
  </span>
  <span id="count"></span>
</div>
<div id="prog"><i></i></div>

<div id="wrap">
  <div id="left"><img id="slide" alt=""></div>
  <div id="right"><div id="note"></div></div>
</div>

<div id="hint">
  <kbd>Enter</kbd> <kbd>→</kbd> <kbd>↓</kbd> <kbd>空格</kbd> 下一页 &nbsp;·&nbsp;
  <kbd>←</kbd> <kbd>↑</kbd> 上一页 &nbsp;·&nbsp; <kbd>Home</kbd> 回到开头 &nbsp;·&nbsp; 输入数字跳页
</div>

<script>
const S = [
{s:"开场", t:"标题页", e:"Class 5: 5G Is Not Just a Phone Network", n:`
<p>先说清楚这节课在整门课里的位置。第 2 到第 4 节课,你一直在<b>教一张图</b>:手机 → RU → DU → CU → 5G 核心网,上面挂着 RIC 和 xApp。学生现在能把这张图默写出来。</p>
<p>今天这节课不教新的图。今天做的事只有一件:<b>把那张图里没写出来的假设,一条一条拆掉</b>。</p>
<h3>整节课的骨架(你自己心里的地图)</h3>
<ol>
  <li><b>第一节(4页)</b>:亮出那张图,点名五条隐藏假设。只制造悬念,不给答案。</li>
  <li><b>第一幕 · 太空(8页)</b>:基站上天了,CDN 也上天了。两篇 SIGCOMM'25。</li>
  <li><b>第二幕 · 计算(10页)</b>:基站里长出了 GPU;再往下走,连空气本身都在算。两篇 SIGCOMM'25。</li>
  <li><b>第三幕 · 安全(10页)</b>:开放让防守方进来了,也让攻击者进来了。三篇论文 + 一个钩子。</li>
  <li><b>收尾(3页)</b>:五条假设全倒,总结成一句话。</li>
</ol>
<h3>你不需要懂每一篇论文的细节</h3>
<p>这一点很重要,先给自己松绑:<b>这节课的目标不是让学生掌握七篇论文</b>,slides 里也明说了这句话(第 4 页)。目标是让学生离开教室的时候有一种感觉 —— <b>图上的每一个盒子、每一条线,都可以被重新想象</b>。</p>
<p>所以每一篇论文你只需要讲清楚三件事:<b>它打破了哪条假设、它换了什么招、它换来了什么数字</b>。这三件事在每一篇的 slides 上都是分开的独立页,不会混。</p>
<div class="say">前面三节课,我教你们这个网络<b>是怎么搭的</b>。今天我们干一件不一样的事:我们去问,<b>它为什么非得这么搭</b>。<br><br>今天要过七篇论文。别慌 —— 我不要求你们记住七篇论文。我要求你们记住一个动作:<b>找出那张图默认成立、但从来没说出口的那句话</b>。</div>
<h3>时间预算(slides 注释里写死的)</h3>
<p>0–7 分钟开场,7–25 太空,25–43 计算,43–72 安全,72–75 收尾。安全这一幕最长,也最容易超时。<b>如果要砍,砍第 30 页</b>(那一页的内容可以在下一页口头带过),slides 注释里点名了它是"第一个该砍的"。</p>
`},

{s:"假设", t:"你们花两节课画出来的那张图", e:"The picture you spent two lectures building", n:`
<p>这一页<b>没有任何新东西</b> —— 它就是 Class 3/4 那张图,一笔不差地重画了一遍。这是故意的:你要让学生产生"这个我会"的安全感,然后再把地板抽掉。</p>
<h3>图上每一段先自己对一遍</h3>
<ul>
  <li><b>UE</b> = 用户设备,就是手机。</li>
  <li><b>RU / DU / CU</b> = 基站被拆成的三块。RU 是天线那一头,DU 是做实时基带计算的那台电脑,CU 管更高层、不那么实时的协议。蓝色大括号圈起来的这三块合起来才叫 <b>gNB</b>(5G 基站)。</li>
  <li>三段线的名字:<b>fronthaul</b>(前传,RU–DU)、<b>F1 / midhaul</b>(中传,DU–CU)、<b>N2/N3 / backhaul</b>(回传,CU–核心网)。</li>
  <li>上面紫色的 <b>RIC + xApp</b> 是 O-RAN 加进来的控制器,虚线连到 DU 和 CU。</li>
</ul>
<div class="warn">这一页有两个盒子今天会被专门攻击,你自己心里要标记:<br><br>· <b>RU–DU 之间那条"fronthaul"线</b> → 第 31 页会告诉学生它现在是一张以太网,可以被软件攻击。<br>· <b>紫色的 xApp 盒子</b> → 第 24–26 页会告诉学生有人真的在里面装了个"杀毒软件"。<br><br>现在<b>一个字都不要提</b>。悬念是这一节唯一的产出。</div>
<div class="ask">这张图是<b>对的</b>。那它<b>默默假设</b>了什么?<br><br>(等 60 秒,收集 2–3 个学生的答案,说出来,写黑板上。)</div>
<h3>学生一定会答错,而这个错就是整节课</h3>
<p>绝大多数学生会说的是<b>少了哪个盒子</b>:"没画 UPF"、"没画 AMF"、"没画计费"。这些回答都不算错,但它们全都<b>停在同一个层面上</b> —— 学生在补图,而不是在质疑图。</p>
<p>你要的不是"少画了什么",是"<b>画出来的这些东西,凭什么就该在那儿</b>"。这个落差就是下一页要填的坑,所以学生答偏了是好事,别急着纠正,笑一下说"记住你的答案,我们等一下回来看"。</p>
`},

{s:"假设", t:"图里从没说出口的五件事", e:"Five things the diagram never says out loud", n:`
<p><b>这是整节课的目录页,虽然它看起来不像目录。</b>后面 30 多页全部挂在这五条上,最后第 34 页再把这五条原封不动地收回来。</p>
<h3>五条,慢慢念,每一条后面停一下</h3>
<table class="n">
<tr><th>假设</th><th>今天由谁打破</th></tr>
<tr><td>1. 基站站在<b>地面上</b></td><td>SN2(第一幕)—— 7.5 km/s 的塔</td></tr>
<tr><td>2. 基站<b>只是个无线电</b></td><td>AoRA + 5G-Spector —— GPU 和杀毒软件搬进来了</td></tr>
<tr><td>3. <b>先传输,后计算</b></td><td>MetaAI —— 电波到达时已经算了一半</td></tr>
<tr><td>4. 基站<b>内部</b>的链路是可信的</td><td>5G Fronthaul(USENIX'24)—— 软件攻击者</td></tr>
<tr><td>5. 攻击网络需要<b>架起</b>一个假基站</td><td>SigOver —— 只要时间对得准</td></tr>
</table>
<p>第 5 条的措辞在第 27 页会<b>一字不差地再出现一次</b>。那个回声是设计好的,你念的时候就用同样的字眼,学生二十分钟后会认出来。</p>
<div class="say">这五句话,没有一句被画在图上。<br><br>这正是它们之所以是<b>假设</b>的原因 —— 如果一件事被画出来了,它就是个设计选择,你可以质疑它;而没被画出来的东西,你根本想不到去质疑。<br><br>今天下课之前,这五条会全部倒掉。<b>还要多加一条</b>,那一条藏得更深 —— 它连个盒子都不是。</div>
<h3>那"多出来的一条"是什么</h3>
<p>是 <b>CDN(内容分发网络)在地面上</b>。第 11 页会揭晓。之所以说它"连个盒子都不是",是因为学生画的 5G 架构图里根本没有 CDN —— 但你每天看的视频有九成来自它。<b>现在不要说破。</b></p>
`},

{s:"假设", t:"今天的行程:四幕七篇", e:"Today's tour: four acts, seven papers", n:`
<p>路标页。<b>指着讲,不要念表格。</b>90 秒。</p>
<h3>四幕各自问的问题</h3>
<ul>
  <li><b>第一幕(蓝)</b>:基站<b>住在哪</b>?两篇 SIGCOMM'25。</li>
  <li><b>第二幕(紫)</b>:基站<b>里面</b>住着什么?两篇 SIGCOMM'25。</li>
  <li><b>第三幕(红)</b>:谁在攻击它,怎么攻击?三篇 + 一个钩子(NDSS'24 + USENIX Security '19/'24/'25)。</li>
  <li><b>第四幕(橙)</b>:那这张图到底是什么?纯综合,没有新论文。</li>
</ul>
<div class="term">
<b>三个会议的名字要解释一句</b>,不然学生只当是随机字母:
<ul>
  <li><b>SIGCOMM</b> —— 计算机网络领域最顶的会议,一年一次,录用率很低。</li>
  <li><b>NDSS</b> / <b>USENIX Security</b> —— 安全领域的两个顶会。</li>
</ul>
今天七篇全部来自这三个地方,而且五篇是 2024–2025 年的。<b>这句话本身就是一个教学点</b>:这些不是教科书里沉淀了十年的东西,是刚发生的事。
</div>
<div class="say">今天要过七篇论文,75 分钟。你们心里肯定在算:一篇十分钟,这怎么可能讲得清楚?<br><br>讲不清楚。<b>我也不打算讲清楚。</b><br><br>今天的目标不是掌握七篇论文 —— 每一幕后面在这门课里都有自己的专场。今天是一次<b>快速巡游</b>,我要你们记住的是这些动作的<b>手感</b>。</div>
<p>底下那句话是这一页真正的落点,慢一点说:<b>"leave feeling that every box and every line can be reimagined."</b>(离开时觉得每个盒子每条线都可以被重新想象。)</p>
`},

{s:"假设", t:"这门课今天换挡", e:"The course changes gears today", n:`
<p><b>这是"换挡"页。</b>说得直白一点:从今天起,这门课开始读论文,而且很快学生自己也要读。</p>
<h3>左右两栏的对比</h3>
<table class="n">
<tr><th>Classes 2–4</th><th>Class 5 起</th></tr>
<tr><td>"它是这么工作的。"</td><td>"哪条假设会断?"</td></tr>
<tr><td>标准、盒子、功能切分</td><td>论文、原型、攻击</td></tr>
<tr><td>已经有定论、有名字的答案</td><td>还没人拍板的问题</td></tr>
</table>
<h3>下面那个问答是这一节的收口</h3>
<p>问:<b>如果这张图是对的,为什么要花一整节课去攻击它?</b></p>
<p>答:因为<b>"正确"不等于"完成"</b>。图告诉你的是<b>已经被建出来的东西</b>;它对<b>被假设了的东西</b>保持沉默。研究就活在这个沉默里 —— 从今天起,这门课也活在这里。</p>
<div class="say">前面几节课,我给你们的每一个问题都有一个答案,而且那个答案有名字、有编号、写在 3GPP 的文档里。<br><br>从今天开始,我给你们的很多问题<b>没有答案</b>。不是我不告诉你们,是<b>全世界还不知道</b>。<br><br>这个转变会让一部分人不舒服。但这就是研究:你从"背下别人的答案"变成"发现还没人问过的问题"。</div>
<div class="warn">如果时间紧,这一页只讲那个 Q/A,左右两栏口头带过就行。但<b>不要整页跳过</b> —— 学生需要一个明确的信号,知道课程的规则变了,不然他们会用"考试要考什么"的心态听后面 70 页。</div>
`},
{s:"第一幕 · 太空", t:"塔离开了地面", e:"The tower left the ground", n:`
<p>第一幕开始,第一篇论文:<b>SN2</b>(清华大学,SIGCOMM 2025)。这一页干三件事:讲清楚 D2C 是什么、说明它已经是真的、点名它打破的假设。</p>
<div class="term">
<ul>
  <li><b>D2C</b> = Direct-to-Cell,直连手机。关键在"直连"两个字。</li>
  <li><b>LEO</b> = Low Earth Orbit,低地球轨道。高度几百公里,绕地球一圈约 95 分钟,轨道速度约 <b>7.5 km/s</b>。</li>
  <li><b>NTN</b> = Non-Terrestrial Network,非地面网络。3GPP(写 5G 标准那个组织)给"卫星蜂窝"起的正式名字。</li>
</ul>
</div>
<h3>这一页的落差在哪</h3>
<p>学生对 Starlink 的印象是<b>屋顶上那个碟子</b>。这篇论文讲的是<b>没有碟子的那个版本</b> —— 你口袋里那部普通手机,直接跟卫星说话,不加任何硬件。</p>
<p>而且这不是设想:<b>T-Mobile + Starlink 从 2025 年 7 月起就在卖卫星短信服务</b>,用的是没改装过的近几年的普通手机(2025 年 10 月又加了数据)。这句话一定要说,它把整节课从"科幻"拉回"已经发生"。</p>
<div class="say">你们见过 Starlink 那个碟子吧?屋顶上一块白板子。<br><br>今天这篇论文讲的不是那个。是<b>没有碟子</b>的那个版本 —— 你现在口袋里这部手机,不加任何东西,直接跟一颗卫星通话。<br><br>而且它不是论文里的设想。<b>2025 年 7 月起就能买了。</b>美国 T-Mobile 和 Starlink 一起在卖,普通手机,发短信。</div>
<h3>假设 1 正式倒掉</h3>
<p class="t">Assumption: 基站站在地上 → Broken by: 一座以 7.5 km/s 移动的塔</p>
<p>这个红色的"Broken by"格式后面还会出现三次(第 20、27、31 页)。<b>它是这节课的节拍器</b>,每次出现都用同样的语气念。</p>
`},

{s:"第一幕 · 太空", t:"同一部手机,非常不同的塔", e:"Same phone. Very different tower.", n:`
<p><b>这是第一幕里最该给学生说话的一页。</b>slides 注释写了硬上限:<b>3 分钟</b>,因为整个第一幕只有 18 分钟。</p>
<h3>图在说什么</h3>
<ul>
  <li><b>左边(今天)</b>:手机 → 塔。塔"钉在地上,归你用好几年"。</li>

</ul>
<div class="ask">你的基站现在以 <b>7.5 公里每秒</b> 移动。<br><br>给你们六十秒:<b>喊出所有会坏掉的东西。</b></div>
<h3>他们会喊出什么(提前准备好接话)</h3>
<p>slides 注释里预判得很准,学生可靠地会产出这几个:</p>
<ul>
  <li><b>切换(handoff)</b>:每几分钟就要换一颗卫星。—— 接:对,而且不是你走动导致的,是<b>塔在跑</b>。</li>
  <li><b>多普勒</b>:相对速度那么大,频率偏移很严重。—— 接:对,这是真问题,但<b>今天这篇论文的痛点不是它</b>。</li>
  <li><b>哪个国家的卫星在服务我</b>:—— 这条最好,直接通向第 8 页。</li>
  <li><b>认证、计费、定位</b>:—— 同样直接通向第 8 页。</li>
</ul>
<div class="warn">这一页<b>一个都不要回答</b>。把答案憋住。<br><br>把学生喊出来的词写在黑板上,不要擦掉 —— 第一幕和第三幕都会回来兑现其中好几个。学生看到自己 40 分钟前喊的词被论文兑现,是这节课最好的教学时刻,别用一句"对,我等下讲"把它花掉。</div>
`},

{s:"第一幕 · 太空", t:"转折:它偷偷跑在 GPS 上", e:"The twist: it secretly runs on GPS", n:`
<p><b>这是 SN2 这篇论文的核心一页。</b>如果这一页学生听懂了,后面两页只是补充。</p>
<h3>论文真正的问题不是学生猜的那些</h3>
<p>学生刚才喊的是多普勒、切换 —— 那些都是<b>无线电问题</b>。这篇论文找到的是一个<b>依赖关系问题</b>,而且是房间里没人会想到的那种。</p>
<p>今天的 D2C 网络,<b>暗地里依赖 GNSS</b>:</p>
<ul>
  <li><b>你在哪</b> → 决定用哪个波束、算哪个国家、账单记给谁。</li>
  <li><b>现在几点</b> → 决定你的手机什么时候可以说话(上行时隙跑在一个共享时钟上)。</li>
  <li>这两个答案,都来自<b>另一套卫星系统</b>。</li>
</ul>
<div class="term">
<b>GNSS</b> = Global Navigation Satellite System,全球导航卫星系统的统称 —— GPS(美国)、Galileo(欧洲)、BeiDou(北斗)都算。<br>
<b>beam(波束)</b> = 卫星对准地面的那一小块区域。<br>
<b>uplink(上行)</b> = 手机往卫星发的方向。
</div>
<div class="say">地面上的塔,<b>知道自己在哪</b> —— 它被水泥浇在那儿,坐标是装机的时候填进去的,一辈子不变。<br><br>一个会跑的塔<b>必须不停地问</b>:我现在在哪?现在几点?<br><br>问题是,它问的对象<b>不是自己</b>,是另外一套卫星 —— GPS。而 GPS 可以被<b>干扰</b>、被<b>欺骗</b>,或者干脆<b>收不到</b>。</div>
<h3>底下那个问答就是论文的实测结果</h3>
<p>问:<b>手机上有卫星信号格,但没有 GPS 定位。会发生什么?</b></p>
<p>答:现场测试里出现了 <b>接入被拒、连接掉线、账单算错</b> —— <b>而且这些是在 D2C 卫星就在头顶的情况下发生的</b>。</p>
<p class="t">一套卫星系统的正确性,挂在另一套卫星系统身上。</p>
<div class="warn">这句话是这一整幕的重点句,别念快了。学生容易理解成"GPS 坏了所以定位不准" —— <b>不是</b>。是 GPS 坏了,导致<b>你连不上网、或者被多收钱</b>,尽管通信卫星好好地在你头顶。定位故障传染成了通信故障,这才是论文说的事。</div>
`},

{s:"第一幕 · 太空", t:"这一招:让网络自己导航", e:"The move: let the network navigate itself", n:`
<p>问题讲完了,这一页是 SN2 的<b>解法</b>。一句话:<b>别借了,自己定位。</b></p>
<h3>三条,逐条讲</h3>
<ul>
  <li>把 <b>D2C 卫星本身</b> 当成定位来源。</li>
  <li>逻辑很干净:<b>你既然能听见这颗卫星,你就能靠它定位。</b></li>
  <li>作者管这个叫 <b>fate-sharing(命运共担)</b> —— 它们要死一起死。</li>
</ul>
<div class="say">现在的做法是<b>借</b>:通信卫星向 GPS 借位置。借来的东西,别人不给你就没了。<br><br>SN2 说:别借。你正在跟一颗卫星通话,<b>那颗卫星本身就带着几何信息</b> —— 你收到的信号里已经藏着"它在哪、你在哪"的线索。用它。<br><br>这样一来,定位和通信<b>共用同一套卫星</b>。通信能用,定位就能用;通信没了,定位没了也无所谓,反正你本来也上不了网。作者叫它 fate-sharing —— <b>命运共担</b>。</div>
<div class="warn">slides 注释里有一条硬规定:<b>不要推导怎么从多普勒或时延算出位置。</b><br><br>这节课的上限就是一句话:"你已经收到的那些信号,里面带的几何信息就够用了。"再往下讲就是另一门课的内容,而且会把 75 分钟的节奏彻底毁掉。</div>
<h3>下面那个问答挡的是最常见的质疑</h3>
<p>问:<b>网络难道不需要 GPS 级别的精度吗?</b></p>
<p>答:<b>不需要。</b>波束、国家、账单需要的是"<b>够用就行</b>"的位置,不是米级精度。</p>
<p>这一点值得多说一句:很多学生下意识觉得"定位就得越准越好"。这里的洞见恰恰相反 —— <b>先问清楚这个位置是拿来干嘛的</b>,你会发现需求比你以为的低得多,而降低精度要求换来的是<b>可用性</b>。</p>
<h3>视频</h3>
<p>这一页挂了 SIGCOMM'25 的报告视频,<b>放 60–90 秒</b>。放在这里是有讲究的 —— 先讲完 GPS 那个转折再放,比放在前面效果好。</p>
`},

{s:"第一幕 · 太空", t:"不再需要 GPS,买到了什么", e:"What refusing to need GPS bought", n:`
<p>数字页。两个数,90 秒。</p>
<ul>
  <li><b>网络可用性</b>:比依赖 GNSS 的传统方案高 <b>4.4–23.5 倍</b>。</li>
  <li><b>接入时延</b>:同样的对比下,低 <b>1.9–12.3 倍</b>。</li>
</ul>
<p>测试用的是<b>支持 3GPP NTN 的市售手机</b>,不是特制设备。</p>
<div class="warn">两条<b>必须说出口</b>的诚实性说明,slides 注释里专门交代了:<br><br>一,<b>范围的两端对应不同场景</b> —— 4.4 倍和 23.5 倍是论文测的各种场景里的两个极端(GNSS 轻度不可用 vs 严重不可用),不是误差棒。上课前对一遍论文的 evaluation 章节,<b>不要临场编场景</b>。<br><br>二,<b>"网络可用性"在这里是什么意思</b> —— 按论文的定义是<b>接入尝试的成功比例</b>,不是"基站在线时间"。这两个东西差很远,学生默认理解成后者。</div>
<div class="say">4.4 到 23.5 倍。这个范围很宽,我解释一下为什么。<br><br>GPS 稍微有点不好用的时候,SN2 赢 4 倍多。GPS <b>严重</b>不可用的时候 —— 比如被干扰了 —— 它赢 23 倍。<br><br>换句话说:<b>情况越糟,这个设计越值钱。</b>这是一个很好的工程性质,你们以后设计系统的时候可以偷这个思路。</div>
<h3>橙框那句话是第一幕上半场的总结</h3>
<p class="t">修的不是更好的 GPS。修的是<b>删掉那条对 GPS 的隐藏依赖</b>。</p>
<p>这句话值得让学生抄下来,因为它是一个可以迁移的思维模式:<b>当一个系统因为依赖别人而不可靠,一个选项是把依赖做得更可靠,另一个选项是把依赖删掉。</b>第二个选项经常被忽略,而且经常更好。</p>
`},

{s:"第一幕 · 太空", t:"为什么 Netflix 晚上八点还很快?", e:"Why is Netflix fast at 8 pm?", n:`
<p>第二篇论文:<b>StarCDN</b>(UIUC + UMass Amherst + <b>Akamai</b>,SIGCOMM 2025)。这一页要先补一个学生没学过的概念。</p>
<h3>先回答那个问答</h3>
<p>问:<b>几百万人同时看视频,为什么网络不崩?</b></p>
<p>答:因为<b>视频很少是从远处来的</b>。CDN(内容分发网络)把热门内容<b>缓存在离你很近的服务器上</b> —— 你所在的城市,有时候就在你的 ISP 机房里。</p>
<div class="term">
<b>CDN</b> = Content Delivery Network,内容分发网络。<br>
说人话:<b>把热门内容提前复制一份放到离用户近的地方</b>。你看 Netflix 的时候,那个视频大概率没有跨越半个美国,它就在你城市的一个机柜里。<br>
学生画的 5G 架构图里<b>根本没有 CDN 这个盒子</b> —— 但他们每天看的视频九成靠它。这就是第 3 页说的"藏得最深的那条假设"。
</div>
<h3>然后把互联网搬到天上</h3>
<p>如果你的网络接入是通过卫星的,那么每一个请求都要:<b>爬到卫星 → 落到地面站 → 在地球上找到缓存 → 再一路爬回天上</b>。这条路荒谬地长。</p>
<p class="t">Assumption: 缓存在地面上,靠近用户 → Broken by: 把 CDN 放到卫星上</p>
<div class="say">这一条藏得比前面五条都深 —— 它<b>连个盒子都不是</b>。你们画的那张架构图上,从来就没有 CDN。<br><br>但你们每天晚上看的视频,大部分是它送的。<b>没被画出来的东西,才是最难质疑的东西。</b></div>
<h3>一个值得提的花絮</h3>
<p>作者名单里有 <b>Akamai</b> —— 全球最大的 CDN 公司之一。也就是说:<b>现有 CDN 的霸主,自己参与写了这篇"把 CDN 搬走"的论文。</b>这句话在讲 papercard 的时候顺口说一下,学生会有反应。</p>
<p>这一页也挂了 SIGCOMM'25 的报告视频,60–90 秒。<b>但注释里明说:如果讨论超时,砍的是这个视频,不是第 7 页的学生提问环节。</b></p>
`},

{s:"第一幕 · 太空", t:"你的缓存正在以 7.5 km/s 飞行", e:"Your cache is doing 7.5 km/s", n:`
<p><b>这一页是第一幕学生最会记住的一页。</b>3 分钟,别赶。</p>
<h3>先把问题摆出来,再揭穿那个动作</h3>
<p>一颗 LEO 卫星绕地球一圈大约 <b>95 分钟</b>。现在飞在佛罗里达上空的那颗,<b>只属于佛罗里达几分钟</b>。</p>
<p>问:<b>它这几分钟里缓存了佛罗里达人爱看的东西。然后呢?</b></p>
<p>答:StarCDN 把缓存的内容<b>沿着星座往后传</b> —— <b>逆着卫星运动的方向</b> —— 交给<b>下一颗即将飞到头顶的卫星</b>。</p>
<div class="say">这个动作有点绕,我换个说法。<br><br>卫星在往前飞,内容在往后传。两个方向<b>正好相反</b>。<br><br>结果是什么?<b>内容一直悬在佛罗里达上空 —— 尽管没有任何一颗卫星做到这一点。</b><br><br>就像接力赛,但反过来:跑的人一直在换,棒子一直在原地。</div>
<h3>内容靠什么传</h3>
<p>星座里的卫星之间有<b>激光链路(inter-satellite laser links)</b>,内容就骑在这上面。这是 Starlink 已经在用的技术,不是论文虚构的。</p>
<div class="warn">图是<b>示意级</b>的:真实轨道是倾斜的平面,不是图上这样整齐的一排。<br><br>slides 注释里特意交代:<b>如果有敏锐的学生质疑,大方承认。</b>页面底部那句话已经写了 "(Picture-level, not real geometry.)"。承认示意图的局限,比硬撑更能建立信任。</div>
<h3>底下那句总结</h3>
<p class="t">一个好用的画面:<b>卫星走了,内容留下了。</b></p>
`},

{s:"第一幕 · 太空", t:"把缓存搬到轨道上买到了什么", e:"What moving the cache to orbit bought", n:`
<p>数字页 + 第一幕的收口。</p>
<ul>
  <li><b>地面–卫星带宽</b>:占用减少约 <b>80%</b>。这条链路是整个系统里<b>最稀缺的资源</b>,省它最值钱。</li>
  <li><b>用户感知时延</b>:比地面 CDN 基线改善约 <b>2.5 倍</b>。</li>

<p>方法:<b>用真实 Akamai CDN 流量轨迹做的 trace-driven 仿真</b>。这句话要说 —— 不是真的发射卫星测的,是用真实流量数据跑的仿真。学生应该学会分辨这个差别。</p>
<div class="warn">对比一下诚实性:上一篇 SN2 用的是<b>市售手机实测</b>,这一篇是<b>仿真</b>。两者都是好研究,但证据强度不一样。<b>顺口点一句这个差别</b>,这是在教学生怎么读论文,比多讲一个技术细节值钱。</div>
<h3>第一幕的比分</h3>
<p class="t">Act I score:<b>塔</b>这个盒子和 <b>CDN</b> 这个盒子都离开了地面 —— 而且系统<b>变得更好了</b>。</p>
<p>"变得更好了"这几个字要重读。因为学生的直觉是"搬到天上肯定更麻烦、更差、只是没办法才这么干"。两篇论文给出的是相反的结论。</p>
<div class="ask">(指着页面底部那条缩小的架构图)<br><br>看看架构图剩下的部分。<b>哪些盒子只是因为习惯才待在地上?</b></div>
<p>这个问题不需要答案,它是通往第二幕的门 —— 第二幕问的是同一张图的另一个方向:不是"盒子在哪",是"<b>盒子里面有什么</b>"。</p>
`},
{s:"第二幕 · 计算", t:"去最近的 GPU 的漫漫长路", e:"The long way to the nearest GPU", n:`
<p>第二幕开始。第三篇论文:<b>AoRA</b>(KAIST + 首尔大学,SIGCOMM 2025 短文)。这一页先把<b>今天的现状</b>画出来,让学生觉得荒谬。</p>
<h3>图上那条路</h3>
<p>手机 →(空口)→ gNB →(回传)→ MEC GPU →(更多网络)→ 云端 GPU。然后橙色虚线:<b>答案原路走回来</b>。</p>
<div class="term">
<b>MEC</b> = Multi-access Edge Computing,多接入边缘计算。<br>
说人话:<b>放在离用户比较近的机房里的服务器</b>,比云端近,但仍然在基站<b>外面</b>,要走一趟回传网络才能到。<br>
<b>gNB</b> = 5G 基站(RU+DU+CU 合起来那个)。
</div>
<div class="say">你问手机上的语音助手一个问题,然后盯着那个转圈的小圈。<br><br><b>那个圈就是这张图。</b><br><br>(用手指沿着路径慢慢划一遍)信号出去、过空口、到基站、走回传、到边缘服务器,如果那儿没有就再往云上走。算完了,答案<b>原路走回来</b>。</div>
<h3>关键的那两句</h3>
<p>"网络侧的'边缘 AI'演示,几乎全都还在跑这条路。"</p>
<p>"<b>gNB 碰到了每一个字节 —— 然后把它们全部转发走。</b>"</p>
<p>第二句是这一页的刀。gNB 明明<b>手里已经有数据了</b>,却什么都不做,只负责传下去。</p>
<div class="ask">在你们 Class 3/4 画的那张图上,<b>GPU 在哪?</b><br><br>(诚实的答案是:<b>不在图上任何地方。</b>这正是假设 2。)</div>
<p class="t">Assumption: 基站只是个无线电 → Broken by: 一个兼职当 AI 服务器的 gNB</p>
<div class="warn">这一页<b>先不要说出 AoRA 这个名字</b>。先让荒谬感立住,第 16 页才揭晓解法。</div>
`},

{s:"第二幕 · 计算", t:"加速器本来就在楼里", e:"The accelerator was already in the building", n:`
<p><b>这是 Class 4 的回收页。</b>这一页要回答一个学生一定会问的问题:<b>基站为什么会有 GPU?</b></p>
<h3>先问,再答</h3>
<div class="ask">基站<b>凭什么</b>会有一块 GPU?它又不是数据中心。</div>
<p>答案是:<b>不是为了 AI 装的,是为了物理层数学装的。</b></p>
<ul>
  <li><b>vRAN</b> 把物理层(PHY)做成了跑在通用服务器上的<b>软件</b>。</li>
  <li>这些服务器越来越多地带 <b>GPU/NPU</b>,专门用来加速 PHY 的运算。</li>
  <li>PHY 的负载<b>跟着话务量涨落</b> —— 半夜没人用,白天满负荷。</li>
  <li>所以那块加速器 <b>不是一直满的</b>。</li>
</ul>
<div class="term">
<b>vRAN</b> = virtualized RAN,虚拟化无线接入网。<br>
<b>PHY(物理层)</b> = 把无线电波解码成比特的那一层。<b>这是重体力的数学活</b>:解调、信道估计、纠错译码,全是大规模矩阵和迭代运算 —— 所以才需要加速器。<br>
<b>NPU</b> = Neural Processing Unit,神经网络处理器。
</div>
<div class="warn">右边那两根柱子(quiet hour / busy hour)是<b>示意的,不是测量数据</b>。slides 注释里明确要求<b>说出口</b>:"Illustrative shares, not measurements."(页面底部也印了这句。)<br><br>别让学生把示意图当成实验结果 —— 这是这门课要反复训练的习惯。</div>
<div class="say">这块加速器不是为了 AI 买的。<b>是为了解无线电信号买的。</b><br><br>但物理层的活儿有个特点:<b>话务多的时候忙,话务少的时候闲</b>。凌晨三点,这块很贵的芯片基本在发呆。<br><br>与此同时,这台发呆的机器坐在<b>全网络最好的位置上</b> —— 离用户只隔一个空口,再没有比它更近的计算了。</div>
<p class="t">橙框:空闲的加速器 + 网络里最好的位置 = <b>一块没人计过费的 GPU</b>。</p>
`},

{s:"第二幕 · 计算", t:"AoRA:基站兼职当 AI 服务器", e:"AoRA: the gNB moonlights as an AI server", n:`
<p>解法页。<b>重点是让学生看见"什么消失了"</b>。</p>
<h3>和第 14 页对照着看</h3>
<p>第 14 页:手机 → gNB → MEC → 云。这一页:手机 →(空口)→ <b>基站(里面装着 Radio + AI server)</b> →(答案直接回来)。</p>
<p class="t">消失的是:<b>回传那一跳</b>。</p>
<h3>三条要点</h3>
<ul>
  <li>推理跑在<b>容器</b>里,用的是 PHY 的<b>空闲余量</b>。</li>
  <li>建在<b>标准 O-RAN 接口</b>上 —— 就是学生上节课见过的那些接口。</li>
  <li>报告的数字:<b>传输时延比 MEC 低 30% 以上,比云端低 70%</b>。</li>
</ul>
<div class="warn">"<b>transport latency(传输时延)</b>"这个词必须解释清楚:它指的是<b>网络上跑的那段路程</b>,<b>不包括模型本身的计算时间</b>。<br><br>不解释的话,学生会以为 AoRA 让模型推理快了 70%。<b>不是。</b>模型该算多久还是多久,省下来的是<b>来回跑路的时间</b>。这个区别很关键,页面底部的 glossline 也专门印了这句。</div>
<div class="say">注意这里省掉的是什么:<b>不是计算变快了,是路变短了。</b><br><br>模型该算多久还是算多久。但数据不用再翻山越岭走一趟回传网络,答案也不用再翻回来。<br><br>这就是为什么它叫 AoRA —— <b>AI on RAN</b>,AI 长在无线接入网里。</div>
<h3>这是一篇短文</h3>
<p>SIGCOMM 的 short paper,篇幅小。slides 注释提醒:<b>忍住,不要展开讲容器和 O-RAN 接口</b>,那一条 bullet 就是上限。</p>
`},

{s:"第二幕 · 计算", t:"忙时:GPU 给谁?(问题)", e:"Busy hour: who gets the GPU? (the question)", n:`
<p><b>这是 AoRA 这篇的真正落点,也是整个第二幕上半场的高潮。</b>3 分钟,别赶。</p>
<p>注意这一页是<b>动画的第一帧</b> —— 答案故意放在第二帧,免得投影仪抢在学生思考之前把答案说了。<b>停在这一帧,不要按下一页。</b></p>
<div class="ask">当小区变忙的时候,GPU 给谁 —— <b>物理层,还是神经网络?</b><br><br>(让学生真的答。至少收集三个回答。)</div>
<h3>学生会怎么答,你怎么接</h3>
<ul>
  <li>大多数人会说 <b>"公平分配"</b> 或 "按优先级动态分"。<b>要顶回去</b>。</li>
  <li>顶回去的理由:<b>PHY 的截止时间是微秒级的,错过就整个小区挂掉</b>。所以"公平"这个框架从一开始就是错的 —— 这不是两个平等的用户在抢资源,这是<b>一个能让整栋楼断电的进程</b>和<b>一个附加功能</b>在抢资源。</li>
  <li>有学生会说"那就多买一块 GPU" —— 接:可以,但那就不叫"用空闲余量"了,整篇论文的经济性就没了。</li>
</ul>
<div class="say">别急着说"公平分配"。<br><br>我给你们一个数量级:<b>物理层的截止时间是微秒级的。</b>错过一次,不是 AI 变慢,是<b>这个小区没有信号了</b>。<br><br>所以这不是两个人分蛋糕。这是一个<b>会炸的东西</b>和一个<b>锦上添花的东西</b>在抢一块芯片。</div>
`},

{s:"第二幕 · 计算", t:"忙时:GPU 给谁?(答案)", e:"Busy hour: who gets the GPU? (the answer)", n:`
<p>答案帧。</p>
<h3>AoRA 的答案:保守</h3>
<p><b>永远是 PHY。</b>错过它的截止时间,<b>小区本身</b>就失效了 —— 没有无线电,就没有任何东西。AoRA 打的是安全牌:<b>PHY 负载一飙升,AI 就让路,回退到 MEC 或云端。</b></p>
<h3>但"安全的答案"不是"最终的答案"</h3>
<ul>
  <li>PHY 负载高 → AI 分得少。PHY 负载低 → AI 分得多。</li>
  <li><b>但是:怎么一秒一秒地调度这个接缝,还没有人搞定。</b></li>
</ul>
<div class="say">AoRA 的答案是<b>让路</b>:PHY 一忙,AI 就退出去,回到 MEC 或者云上。这个答案是<b>对的</b>,但它也是<b>最保守的那个</b>。<br><br>它相当于说:"两个人抢一块芯片,那我们规定其中一个永远赢。" 这肯定不会出事,但这也肯定不是最优的。<br><br>真正的问题是:<b>能不能一秒一秒地、精细地在两者之间调</b>?这个问题<b>现在没有答案</b>。</div>
<p class="t">橙框:通信—计算的联合调度还太年轻,<b>这间教室里的一个学生就可能推动它。</b></p>
<div class="warn">这句话不要当口号念。slides 注释里的原话是:<b>plainly say that this seam is where course projects live.</b>(直白地说:这条接缝就是课程项目的所在地。)<br><br>说得越具体越好 —— 这是一句<b>招募</b>,不是一句鸡汤。可以顺口加一句:"如果你想做这门课的项目,这里有一个真的没人做完的题。"</div>
`},

{s:"第二幕 · 计算", t:"今天最奇怪的一个问题(问题帧)", e:"The strangest question of the day", n:`
<p>第四篇论文:<b>MetaAI</b>(西北大学 + 纽约州立布法罗,SIGCOMM 2025)。</p>
<p><b>这一页只有一句话:</b></p>
<p class="t">Can the air itself be a computer?(空气本身能不能是一台计算机?)</p>
<div class="warn">slides 注释给了一条非常具体的指令:<b>把问题念一遍,然后停住。在心里数到五,再说任何别的话。</b><br><br><b>这个沉默就是这一页。</b>不要用讲解填满它。这是整节课唯一一次刻意的停顿,值得。</div>
<div class="say">(念一遍,然后闭嘴,数五秒)<br><br>空气本身,能不能是一台计算机?</div>
<h3>为什么要这么处理</h3>
<p>因为接下来那个想法本身就很反直觉,如果学生还在惯性里滑行,他们会听成"哦又一个 AI 加速的论文"。那五秒的停顿是在<b>换挡</b>,让他们准备好接一个奇怪的东西。</p>
`},

{s:"第二幕 · 计算", t:"今天最奇怪的一个问题(揭晓帧)", e:"The strangest question — the assumption", n:`
<p>第二帧揭晓被打破的假设。</p>
<p class="t">Assumption: 先传输,后计算 → Broken by: 一个到达时已经算了一半的电波</p>
<h3>这条假设为什么最难看见</h3>
<p>前面四条假设,你至少能想象反过来的样子("基站在天上"、"基站里有 GPU")。这一条不一样 —— <b>"先传数据,再算数据"这件事根本不像是一个可以被质疑的选择,它像是物理定律。</b></p>
<p>第 3 页那五条里,这一条(第 3 条)当时是最抽象、最没人有感觉的一条。现在它要变得具体了。</p>
<div class="say">回想一下第 3 页那五条假设。第三条当时我念的时候你们大概没什么反应:"数据是先传输,后计算的。"<br><br>因为这听起来<b>根本不像一个假设</b>,它听起来像一句废话 —— 不先把数据送到,你拿什么算?<br><br>接下来这篇论文,就是在拆这句"废话"。</div>
`},

{s:"第二幕 · 计算", t:"同样的数学,不同的部门", e:"Same math, different department", n:`
<p><b>这是 MetaAI 唯一的技术页,也是这节课最需要你自己先想通的一页。</b>3 分钟,每一行都慢。</p>
<h3>两个公式,一模一样</h3>
<table class="n">
<tr><th>信道在做什么</th><th>一个线性层在做什么</th></tr>
<tr><td><span class="t">y = Σ h_i x_i</span></td><td><span class="t">y = Σ w_i x_i</span></td></tr>
<tr><td>重叠的电波<b>叠加</b>,权重由各自的路径决定</td><td>输入<b>叠加</b>,权重是学出来的</td></tr>
<tr><td><b>物理免费送你这个。</b></td><td><b>GPU 收你钱。</b></td></tr>
</table>
<h3>把符号讲清楚,不然学生一定糊</h3>
<ul>
  <li><b>x_i</b> = 沿着<b>某一条路径</b>走的那一份信号副本。</li>
  <li><b>h_i</b> = 那条路径给它的<b>权重</b>(信道系数)。信号打在墙上、打在反射面上,反射回来会变弱、会转相位 —— 这就是 h_i。</li>
  <li>接收机收到的是<b>所有路径的和</b>。这就是无线通信里最基本的"多径"现象。</li>
</ul>
<div class="say">无线信道每天都在做一件事:<b>把很多条路径上过来的信号加起来</b>,每一条乘以一个系数。<br><br>神经网络的一个线性层也在做一件事:<b>把很多个输入加起来</b>,每一个乘以一个权重。<br><br>你们看这两个公式 —— <b>它们是同一个式子。</b>一个字母叫 h,一个字母叫 w。<br><br>区别只有一个:<b>物理免费做这件事,GPU 收你钱。</b></div>
<h3>关键的一跳</h3>
<p><b>可编程超表面(programmable metasurface)</b>让软件可以<b>设定 h_i</b>。</p>
<p>那么:<b>令 h_i = w_i,传播本身就是那一层。</b></p>
<div class="term">
<b>Metasurface(超表面)</b> = 一块平板,上面布满极小的反射单元,<b>每个单元的反射特性可以被软件调</b>。<br>
所以它不是一面普通的墙 —— 它是一面<b>你能编程的墙</b>。你告诉它每个格子怎么反射,你就等于设定了每条路径的 h_i。
</div>
<div class="warn">一定会有敏锐的学生问:<b>"那 ReLU 呢?非线性在哪?"</b><br><br>slides 注释里准备好了弹药,照着答:<b>大自然免费给你的是乘加,不是非线性。</b>缺掉的那个非线性,正是为什么这只是<b>第一步</b>,而不是一个完整的神经网络。<br><br>这个学生问得非常好,要当众夸他 —— 然后告诉他,这个缺口就是下一篇论文的位置。</div>
`},

{s:"第二幕 · 计算", t:"MetaAI:电波到达时已经算了一半", e:"MetaAI: the wave arrives partially computed", n:`
<p>系统图页。<b>重点还是看"什么消失了"。</b></p>
<h3>两行对照</h3>
<ul>
  <li><b>今天</b>:传感器 →(全部传过去)→ 接收机 → <b>GPU</b> → 神经网络。</li>
  <li><b>MetaAI</b>:传感器 →(电波)→ <b>超表面(= 第一层)</b> →(算过的电波)→ 接收机 → 答案。</li>
</ul>
<p class="t">消失的是:<b>GPU 那个盒子。</b></p>
<div class="say">看这两行,指出<b>不见了的东西</b>。<br><br>上面那行有个 GPU。下面那行没有。<br><br>下面那行里,那块超表面<b>就是神经网络的第一层</b>。电波穿过它的时候,那一层的计算<b>已经做完了</b> —— 不是"更快地做完",是<b>在飞行途中顺便做完的</b>。<br><br>通信和计算,不再是<b>先后</b>两步。它们是<b>同一个物理事件</b>。</div>
<div class="warn">主角从"手机"换成了"<b>传感器</b>",这是<b>故意的</b>,而且要说出口。<br><br>MetaAI 的演示任务是<b>识别传感器看到的东西</b>(简单分类),<b>不是聊天、不是大模型</b>。不说这句,学生会以为手机不见了或者你画错了。</div>
<h3>诚实的补充</h3>
<p>接收机把叠加后的电波读作"这一层的输出",<b>然后再把剩下的(很小的)网络算完</b>。所以不是整个网络都在空气里 —— 是<b>第一层</b>在空气里。</p>
<div class="warn">slides 注释:<b>不要打开超表面的设计原理</b>,那是后面某节课的内容。这一页的上限就是"软件能调这块板子"。</div>
`},

{s:"第二幕 · 计算", t:"他们到底做出了什么 —— 老实说", e:"What they built — honestly", n:`
<p><b>诚实页。</b>前面三页给了学生惊奇,这一页要把惊奇的边界划清楚。3 分钟。</p>
<h3>真实硬件,朴素的脑子</h3>
<ul>
  <li>原型工作在 <b>2.4/5 GHz</b> 和 <b>3.5 GHz</b> —— 也就是 Wi-Fi 和 5G 的地盘。</li>
  <li>平均分类准确率 <b>82.8%</b>,最高 <b>89.8%</b>。</li>
  <li>今天的范围:<b>线性层,简单识别任务</b>。</li>
  <li><b>这是第一步。这不是"空气里的 GPT"。</b></li>
</ul>
<h3>那个问答是这一页的灵魂</h3>
<p>问:<b>82.8% 在 Kaggle 上会被吊打。SIGCOMM 为什么在乎?</b></p>
<p>答:因为<b>那个数字不是贡献,存在性证明才是</b>。一个神经网络的层<b>真的在射频硬件上跑起来了</b>,而且是<b>在电波飞行的过程中算完的</b> —— <b>没有任何 GPU 碰过它</b>。刷榜是以后的事。</p>
<div class="say">82.8%。说实话,这个数字在任何一个机器学习比赛里都会被笑话。<br><br>但你们要理解<b>这篇论文在争什么</b>。它不是在争"我的模型更准",它在争一件更基本的事:<b>这件事能不能发生。</b><br><br>科学里有一类结果叫<b>存在性证明</b>。它不告诉你怎么做得好,它只告诉你:<b>这不是不可能的。</b>而一旦一件事被证明可能,后面就会有一百个人来把数字刷上去。<br><br>第一个把准确率做到 82.8% 的人,和第一个把它做到 95% 的人,历史地位是不一样的。</div>
<h3>第二幕收口</h3>
<p class="t">AoRA 把 AI 搬<b>进了</b>盒子。MetaAI 把盒子<b>溶进了空气</b>。</p>
<p>这句话是整个第二幕的一句话总结,慢一点说,然后进第三幕。</p>
`},
{s:"第三幕 · 安全", t:"能不能给基站装杀毒软件?", e:"Can we install antivirus on a cell tower?", n:`
<p>第三幕开始,最长的一幕(43–72 分钟),三篇论文加一个钩子。第五篇:<b>5G-Spector</b>(俄亥俄州立 + SRI,NDSS 2024)。</p>
<div class="warn"><b>整幕的框定边界,slides 注释里写得很硬,你自己先记牢:</b><br><br>· 这里所有内容都是<b>已发表、经过同行评审</b>的研究,而且只讲<b>概念层面</b>。<br>· <b>不给命令、不给配置、不给操作步骤。</b><br>· 不暗示教室里任何人正在被攻击。<br>· 如果学生问"我能做这个吗":论文是公开的,代码是否发布是作者的事;<b>这门课教的是"架构为什么让攻击成为可能",目的是让防守方看懂</b>。<br><br>这段话最好在第三幕开头<b>主动说一遍</b>,不要等学生问。</div>
<h3>这一页的类比</h3>
<p>左栏问:<b>PC 为什么会有杀毒软件?</b></p>
<p>答案不是"因为它是电脑"。是因为它变成了<b>任何人都能往上装软件的可编程平台</b> —— <b>包括防守方</b>。</p>
<p>右栏:<b>那 RAN 呢?</b>几十年来,基站跑的是<b>单一厂商的封闭固件</b>。上节课学生学到,O-RAN 把它打开了:<b>RIC + xApp</b>。</p>
<div class="say">杀毒软件的存在,不是因为电脑聪明。是因为电脑变成了<b>一个谁都能往上装东西的平台</b>。<br><br>坏人能装,<b>好人也能装</b>。这两件事是同一个性质的两面。<br><br>那基站呢?几十年来,基站是一个黑盒子 —— 爱立信卖给你,里面跑爱立信的固件,你什么都装不进去。<b>包括杀毒软件。</b></div>
<div class="ask">如果这个塔现在是一个<b>平台</b>了,你能不能往上装一个<b>安全应用</b>?<br><br>(先问,再翻页。大多数学生会说"不行,塔又不是电脑"。<b>这就是下一页要弹开的陷阱。</b>)</div>
`},

{s:"第三幕 · 安全", t:"不是深度学习 —— 是遥测加规则", e:"Not deep learning — telemetry plus rules", n:`
<p><b>这一页最重要的作用是纠正一个默认预期。</b>3 分钟。</p>

<p>5G-Spector 是<b>遥测 + 规则</b>,和经典的入侵检测系统是同一个形状。<b>没有模型要训练,没有黑盒子。</b></p>
<h3>那条管道,从左到右画</h3>
<p class="t">RAN 事件 → MobiFlow 遥测 → MobiExpert 规则 xApp → 告警</p>
<ul>
  <li><b>MobiFlow</b> = 一条细粒度的 RAN 事件流。<b>直接说"这是 RAN 版的 NetFlow"</b>,然后让这句话落地。</li>
  <li><b>MobiExpert</b> = 跑在 RIC 上的一个 xApp,在那条流上跑产生式规则。</li>
</ul>
<div class="term">
<b>NetFlow</b> = 网络管理员本来就在收的那种"每条连接一条记录"的日志。谁连了谁、什么时候、多少字节。<br>
<b>Layer-3(第三层)</b> 在蜂窝网里指<b>信令层</b> —— 附着(attach)、来电提醒、切换消息这一类<b>控制消息</b>,不是用户数据。今天讲的攻击都发生在这一层。

<div class="say">注意这个系统<b>不是</b>什么。它不是"我们训了个大模型,它能看出攻击"。<br><br>它是<b>两个非常朴素的东西</b>:第一,把基站里发生的事详细记下来 —— 这就是 MobiFlow,你可以理解成 RAN 版的 NetFlow。第二,拿一堆规则去扫这些记录 —— 这就是 MobiExpert。<br><br>就这样。<b>没有模型要训,没有黑盒子。</b><br><br>为什么我要强调这一点?因为你们这一代看到"检测"两个字就想到深度学习。而这篇论文告诉你:<b>在一个此前根本没有可见性的地方,把日志收起来这件事本身,就已经是贡献了。</b></div>
<div class="warn">画那条管道的时候,<b>指着 xApp 那个盒子说:"这个盒子是你们上节课自己画的。"</b> 这个连接感很重要 —— 学生上节课画的抽象方块,现在有人在里面装了真东西。</div>
`},

{s:"第三幕 · 安全", t:"不架塔也能攻击", e:"Attacking without building a tower", n:`
<p>第六篇论文:<b>SigOver</b>(KAIST,USENIX Security 2019)。这是<b>转折页</b> —— 从"怎么防"切到"攻击长什么样"。</p>
<h3>先把假设念出来,一字不差</h3>
<p class="t">Assumption: 攻击网络需要<b>架起</b>一个假基站。→ Broken by: 用完美的同步,在真塔旁边小声说话,而且稍微大声一点。</p>
<div class="warn">这句假设的措辞和第 3 页第 5 条<b>完全一样</b>,这是设计好的回声。<b>用同样的字眼念出来</b>,让学生认出"这句话我 40 分钟前听过"。</div>
<h3>为什么假基站是个笨办法</h3>
<p>一个流氓基站是<b>吵的、显眼的、容易被找到的</b> —— 那是<b>一整座不该存在的塔</b>。运营商有的是办法发现它。</p>
<h3>SigOver 干的事</h3>
<p>它<b>从来不建塔</b>。它<b>同步到合法的 LTE 下行链路</b>,然后<b>只覆写它挑中的那些子帧</b>。</p>
<div class="term">
<b>subframe(子帧)</b> = LTE 帧里的一个时间片,<b>每个 1 毫秒</b>。信号是按这种固定的时间格子发的。<br>
<b>downlink(下行)</b> = 塔发给手机的方向。<br>
<b>overshadow(盖过)</b> = 在同一个时间、同一个频率上,用稍强的信号<b>盖在真信号上面</b>。
</div>
<div class="say">攻击一个蜂窝网络的经典办法,是<b>架一个假基站</b>。你们上节课听过。<br><br>问题是,假基站<b>很吵</b>。它是一整座本来不该在那儿的塔,运营商扫一遍频谱就看见了。<br><br>SigOver 完全不建塔。它做的是:<b>听真塔在讲什么,跟上它的节拍,然后在它讲某一句话的那一毫秒,用稍微大一点的声音,把那句话盖掉。</b></div>
<p class="t">橙框:<b>你不需要一座新塔来撒谎 —— 你需要更好的时间同步。</b></p>
`},

{s:"第三幕 · 安全", t:"干扰、伪装、盖过", e:"Jamming, spoofing, overshadowing", n:`
<p><b>这一页的类比就是整页内容。</b>3 分钟。</p>
<h3>三种攻击,一行一句,让对比自己说话</h3>
<table class="n">
<tr><th>攻击</th><th>受害者经历了什么</th></tr>
<tr><td><b>Jamming(干扰)</b></td><td>你<b>什么都听不见</b> —— 信道被噪声淹了。</td></tr>
<tr><td><b>Spoofing(假基站)</b></td><td>你<b>换了塔</b> —— 一个新小区把你勾过去了。</td></tr>
<tr><td><b style="color:#b22c2c">Overshadowing(盖过)</b></td><td>你听见的是<b>攻击者</b>,但你以为那是<b>你自己的塔</b>。</td></tr>
</table>
<p>三者的差别不在技术,在<b>受害者的主观体验</b>。干扰是"没信号",假基站是"换了个塔",盖过是"<b>什么都没发生</b>" —— 这才是它可怕的地方。</p>
<div class="say">两个人同时对你说话,<b>时间完全对齐,一个字一个字重合</b>。<br><br>你的耳朵会怎么样?<b>它保留声音大的那个。</b>而且它<b>完全不会察觉刚才有两个人在说话。</b><br><br>这就是 overshadowing。不是让你听不见,不是把你骗走 —— 是<b>让你听见假话,并且相信那是真话</b>。</div>
<div class="warn"><b>范围说明是强制的,必须说出口。</b>页面底部已经印了,但你要念:<br><br>· 这是 <b>LTE</b>,<b>2019 年</b> 的工作。<br>· 它针对的是 LTE 的<b>广播消息</b>,这类消息<b>从来就没有完整性保护</b> —— <b>认证前后都没有</b>。<br>· 它<b>不是</b>关于 5G 用户数据的论断。<br><br>不说这三句,学生会走出教室告诉别人"5G 可以被随便伪造"。那是错的,而且是你造成的。</div>
`},

{s:"第三幕 · 安全", t:"藏在明处的信号里", e:"Hiding in plain signal", n:`
<p>数字页。<b>这一页有一个真正漂亮的对比,值得慢讲。</b></p>
<ul>
  <li>只要强 <b>3 dB</b>(大约两倍功率)的信号就能赢。</li>
  <li>成功率 <b>98%</b> —— 相比之下假基站是 <b>80%</b>。</li>
  <li>而那个假基站需要 <b>35 dB</b>(大约 <b>3000 倍</b>)的优势。</li>

  <li>假基站没这个运气:它必须<b>把小区选择过程喊赢</b>。</li>
</ul>
<div class="term">
<b>dB(分贝)</b> 是对数刻度:<b>3 dB ≈ 2 倍功率,10 dB = 10 倍,35 dB ≈ 3000 倍</b>。<br>
<b>capture(捕获效应)</b> = 收音机锁定<b>对齐得最好、最强</b>的那个信号,把其余的当噪声扔掉。<br>
<b>cell selection(小区选择)</b> = 你的手机决定驻留在哪个塔上的那个流程。
</div>
<div class="say">这一页的punchline在这里,你们对着看:<br><br><b>盖过攻击:强 3 dB,成功率 98%。</b><br><b>假基站:强 35 dB —— 三千倍 —— 成功率 80%。</b><br><br>三千倍的功率,换来更差的结果。为什么?<br><br>因为受害者的接收机<b>本来就是被设计成"锁定对得最准的那个信号"的</b>,<b>不是"锁定最响的陌生人"</b>。攻击者不是在跟真塔比嗓门,他是<b>在利用接收机自己的规则</b>。<br><br>这是安全里一个反复出现的教训:<b>最狠的攻击不是打破规则,是顺着规则走。</b></div>

<p>USENIX Security'19 的报告里有 demo,<b>放大约 90 秒</b>,放完就走。</p>
`},

{s:"第三幕 · 安全", t:"如果攻击者根本不发无线电呢?", e:"What if the attacker never transmits a radio signal?", n:`

`},

{s:"第三幕 · 安全", t:"基站内部的那条线现在是一张网", e:"The link inside the tower is now a network", n:`
<p><b>揭晓页,而且是整个第三幕最需要精确措辞的一页。</b>3 分钟。</p>
<h3>那条线是 fronthaul(前传),RU–DU 之间</h3>
<table class="n">
<tr><th>以前</th><th>拆分后的 5G</th></tr>
<tr><td>前传是<b>专用的点对点光纤(CPRI)</b> —— 实质上是私有布线,<b>物理上被信任</b>。</td><td><b>交换式、基于分组的以太网(eCPRI)</b> —— 而为了跑得够快,<b>没有人被要求检查包是不是真的</b>。</td></tr>
</table>
<div class="term">
<b>RU</b> = Radio Unit,天线那一端。<b>DU</b> = Distributed Unit,做基带计算的那台电脑。<br>
<b>CPRI / eCPRI</b> = RU 和 DU 之间的协议。CPRI 是老的专线版本,<b>eCPRI 是跑在普通以太网上的分组版本</b>。<br>
<b>完整性保护(integrity protection)</b> = 在包上加密码学校验,让接收方能确认"这个包确实来自它声称的发送者,而且没被改过"。
</div>
<div class="say">这条线,你们上节课画过。它在 RU 和 DU 之间,你们大概只写了两个字:前传。<br><br>以前它是什么?<b>一根专用光纤</b>,从天线拉到机房,中间不经过任何东西。它是"私有布线",所以大家<b>默认它是安全的</b> —— 因为你要动它,得爬到塔上去。<br><br>现在它是什么?<b>一张普通的以太网。</b>交换机、分组、和别的流量共享。<br><br>而这里有一个关键的取舍:前传的时延预算是<b>微秒级</b>的。加密码学校验要花时间。所以标准<b>没有强制要求</b>做完整性保护 —— 理由是性能开销大,而且"风险低"。<br><br><b>这篇论文测的就是"风险低"这三个字。</b></div>
<div class="warn">措辞的红线,slides 注释里反复强调:<br><br>· 说的是"<b>标准没有要求</b>"和"<b>部署实践如此</b>"。<br>· <b>不是</b>"每一个网络都门户大开"。<br><br>页面底部那句 framing 已经写得很小心:标准以性能开销和"假定低风险"为由不要求完整性保护 —— <b>那个假定,就是论文要测的东西</b>。照着这个措辞说。</div>
<p class="t">Assumption: 基站内部的链路是可信的 → Broken by: 一个待在前传以太网上的软件攻击者</p>
`},

{s:"第三幕 · 安全", t:"光靠软件能干什么", e:"What software alone could do", n:`
<p>结果页 + <b>整个第三幕的收口</b>。3 分钟。</p>
<h3>先把规模说清楚,再报数字</h3>

{s:"第三幕 · 安全", t:"血脉没有随 LTE 一起终结", e:"The lineage did not die with LTE", n:`
<p>钩子页。<b>Sni5Gect</b>(新加坡科技设计大学 SUTD,USENIX Security 2025)。<b>只有一页,讲完就停。</b></p>

<p><b>This is a first step. It is not GPT in the air.</b></p>
<p>So — 82.8 percent would be laughed off a Kaggle leaderboard. <b>Why does SIGCOMM care?</b></p>
<p>Because <b>the number is not the contribution. The existence proof is.</b> A neural network layer ran on real RF hardware and computed while the wave was travelling, and <b>no GPU touched it</b>.</p>
<p>There is a category of scientific result that only says <b>this is not impossible</b>. Once something is shown to be possible, a hundred people arrive to push the number up. <b>The person who gets to 82.8 first and the person who gets to 95 later do not occupy the same place in the story.</b></p>
<p>Act Two, one line: <b>AoRA moved the AI into the box. MetaAI dissolved the box into the air.</b></p>`,
`<p>Act Three, and before I start, one boundary — I will say it once and I mean it.</p>
<p>Everything in this act is <b>published, peer-reviewed research</b>, described at the <b>concept level</b>. No commands, no configurations, no recipes. Nothing here says anyone in this room is being attacked. If you want to know whether you can do this: <b>the papers are public, the code is the authors' to release, and this course teaches how the architecture makes attacks possible so that defenders understand them.</b></p>
<p>Now. <b>Why did PCs get antivirus?</b></p>
<p>Not because they were computers. Because they became <b>programmable platforms anyone could ship software to</b> — and that includes <b>defenders</b>. Attackers can install things; so can the people protecting you. Same property, both directions.</p>
<p>And the RAN? For decades a base station ran <b>one vendor's locked firmware</b>. Ericsson sold you a box, the box ran Ericsson's code, and you installed nothing. <b>Including antivirus.</b></p>
<p>Last class you learned O-RAN opened it up: <b>RIC and xApps</b>.</p>
<p>So: <b>if the tower is now a platform, can you install a security app on it?</b></p>`,

`<p>Yes. And the shape of it is going to surprise you.</p>
<p>Notice what this system is <b>not</b>. It is <b>not</b> "we trained a large model and it spots attacks."</p>
<p>It is two very plain things. First, <b>write down in detail what happens in the RAN</b> — that is <b>MobiFlow</b>. Think of it as <b>NetFlow for the RAN</b>: the per-connection logs network admins have collected for decades, but for cellular events. Second, <b>run rules over that stream</b> — that is <b>MobiExpert</b>, an xApp running on the RIC.</p>
<p>That is it. <b>No model to train. No black box.</b></p>
<p>What it watches for are known <b>layer-3</b> attack patterns — layer three here meaning <b>the signalling layer</b>: attach, paging, handover. Control messages, not your data.</p>
<p>And I want to stress this, because your generation sees the word "detection" and thinks deep learning. <b>In a place that previously had no visibility at all, simply collecting the logs is already the contribution.</b></p>
<p>One more thing — <i>[point at the xApp box]</i> — <b>you drew this box yourselves last class.</b></p>`,

`<p>What it caught, and what it cost.</p>
<p><b>Seven classes</b> of layer-3 cellular attack, detected in real time. Shown to extend to <b>eleven previously unknown attacks</b> just by <b>writing new rules</b> — which is the platform property doing real work: the operator updates rules, <b>not the whole network</b>. Like updating virus definitions instead of reinstalling the operating system.</p>
<p>Cost: <b>under two percent CPU, under a hundred megabytes of memory</b>. Those numbers matter more than they look. A base station's compute budget is tight; a security function that eats thirty percent of the CPU never gets switched on.</p>
<p>And it won an <b>NDSS 2024 Distinguished Artifact Award</b>. Let me tell you what that actually means, because it is not bragging rights. It means <b>another group of people took their code, ran it themselves, and reproduced the results</b>. In systems security that is <b>rarer than it should be</b>.</p>
<p>So — was the xApp box on our O-RAN slide just a PowerPoint concept? <b>No.</b> Somebody shipped a working security function inside it, and a committee re-ran it. <b>That box on your diagram is a place where code actually lives.</b></p>
<p>One last thing before we leave this slide, and I want you to <b>hold on to it</b>: <b>this antivirus trusts the telemetry the network feeds it.</b> Pocket that. We come back to it in twenty minutes.</p>`,

`<p>Now we turn around. 5G-Spector detects attacks — but what does a modern attack even look like?</p>
<p>Here is what all of you believe, from last class: <b>attacking the network requires standing up a fake base station.</b> Those are my exact words from slide three, and I am repeating them on purpose.</p>
<p>Broken by: <b>whispering in perfect sync with the real tower, slightly louder.</b></p>
<p>Think about why a rogue base station is a clumsy weapon. It is <b>loud, obvious, and easy to look for</b> — it is <b>an entire tower that should not be there</b>. Operators can sweep for it.</p>
<p>SigOver never builds one. It <b>synchronises to the legitimate LTE downlink</b> and <b>overwrites only the subframes it chooses</b> — a subframe being a one-millisecond slice of the LTE frame.</p>
<p>It listens to what the real tower is saying, matches its rhythm exactly, and then — for one millisecond — <b>says something else, slightly louder</b>.</p>
<p><b>You do not need a new tower to lie. You need better timing.</b></p>`,

`<p>Three attacks. Read one line each and let the contrast teach.</p>
<p><b>Jamming:</b> you hear <b>nothing</b>. The channel is drowned out.</p>
<p><b>Spoofing, the fake base station:</b> you <b>switch towers</b>. A new cell lures you over.</p>
<p><b>Overshadowing:</b> you hear <b>the attacker</b> — and you believe it is <b>your own tower</b>.</p>
<p>The difference is not really technical. It is <b>what the victim experiences</b>. Jamming feels like no service. Spoofing feels like changing cells. Overshadowing feels like <b>nothing at all happened</b>. That is what makes it frightening.</p>
<p>Here is the analogy, and it is the whole slide. <b>Two people speak to you with identical timing</b> — word for word, overlapping. Your ear <b>keeps the louder one</b>, and <b>never notices there were two</b>.</p>
<p>Now the scope, and I have to be precise. <b>This is LTE, from 2019.</b> It targets LTE <b>broadcast</b> messages, which are <b>never integrity protected — before or after authentication</b>. <b>It is not a claim about 5G user traffic.</b> Please do not leave this room telling people 5G can be forged at will.</p>`,

`<p>Now the numbers, and there is a genuinely beautiful comparison here.</p>
<p>A signal only <b>three decibels</b> stronger wins — that is about <b>twice</b> the power. Success rate: <b>ninety-eight percent</b>.</p>
<p>Versus a fake base station: <b>eighty percent</b> success — and it needed a <b>thirty-five decibel</b> edge. Thirty-five dB is roughly <b>three thousand times</b> the power.</p>
<p>Put those side by side. <b>Three thousand times the power, for a worse result.</b> Why?</p>
<p>Because timing is what buys you the receiver. A <b>time-aligned</b> signal wins the receiver's <b>capture</b> — the radio locks onto the best-aligned strong signal and treats everything else as noise. The fake tower gets no such help: it has to <b>out-shout cell selection</b>, the process your phone uses to pick a tower.</p>
<p>And there is a lesson in that which goes well beyond this paper. <b>The most effective attacks usually do not break the rules. They follow them.</b></p>
<p><i>[Play about ninety seconds of the demo, then move on.]</i></p>`,

`<p>SigOver was <b>intensely physical</b>: a software radio, microsecond timing, power measured in decibels.</p>
<p>Now turn the question inside out.</p>
<p>Suppose the attacker <b>never transmits a radio signal at all</b>. No antenna, no power amplifier. Just software running on some machine.</p>
<p><b>What could you break?</b></p>
<p><i>[Let it sit.]</i></p>
<p>The answer is on a link <b>you drew last class and never thought twice about</b>.</p>`,

`<p>It is the <b>fronthaul</b>. The line between RU and DU. You drew it and wrote one word on it.</p>
<p><b>Before disaggregation</b>, that link was <b>dedicated point-to-point fibre</b> — CPRI. Effectively private wiring. <b>Physically trusted</b>, because to tamper with it you had to climb the tower.</p>
<p><b>In disaggregated 5G</b>, it is <b>switched, packet-based Ethernet</b> — eCPRI. Switches, packets, shared infrastructure.</p>
<p>And here is the trade that matters. The fronthaul has a <b>microsecond</b> latency budget. Cryptographic integrity checks cost time. So <b>the fronthaul standards do not require integrity protection</b> — citing performance overhead and <b>assumed low risk</b>.</p>
<p>Let me be careful with my words: I am telling you <b>what the standards require</b> and <b>what deployments do</b>. I am <b>not</b> telling you that every network out there is wide open.</p>
<p><b>That assumption — "low risk" — is what this paper tests.</b></p>
<p>So: <b>the links inside the base station are trustworthy.</b> Broken by <b>a software attacker on the fronthaul Ethernet</b>.</p>`,

`<p>What could software alone do? First, <b>the scale</b>, so nobody mishears this.</p>
<p>A <b>commercial-grade, multi-cell testbed</b>. <b>Two compromised cells. Four users.</b> That is the experiment. Not a country.</p>
<p>With that: user performance degraded by <b>more than eighty percent</b>. Targeted users <b>prevented from ever attaching</b> to the cell. Signalling storms — floods of junk control messages — <b>over twenty-five hundred messages a minute</b>.</p>
<p>Now the question that closes this act. The same opened seams that let <b>5G-Spector</b> in also let <b>this attacker</b> in. So: <b>safer, or more dangerous?</b></p>
<p><b>Both.</b> Openness is <b>a trade, not a verdict</b> — which is precisely why this is research and not settled fact.</p>
<p>And now the thing I asked you to pocket twenty minutes ago. <b>5G-Spector trusts the telemetry the network feeds it.</b> And <b>this attacker sits on the wires that telemetry rides.</b></p>
<p><i>[Pause.]</i></p>
<p><b>Could it lie to the antivirus?</b></p>
<p>I am not going to answer that. As far as I know, <b>nobody has answered it properly yet</b>.</p>`,

`<p>Last thing in this act, and it is a hand-off, not a lecture.</p>
<p>SigOver was 2019, and it was LTE. You might reasonably assume 5G fixed it.</p>
<p>In 2025, the same core idea came back — <b>attack without a rogue tower</b> — this time against <b>5G NR</b>.</p>
<p>Real-time sniffing of <b>pre-authentication</b> 5G NR traffic — messages sent <b>before the phone has proved who it is</b>, which is a structurally fragile moment. Targeted downlink message injection, <b>no rogue base station</b>. And <b>seventy to ninety percent</b> injection success at up to <b>about twenty metres</b>.</p>
<p>I am deliberately not explaining the mechanism. <b>One of you is going to present this paper in the practicum.</b></p>
<p>The single idea I want left in the room: <b>SigOver's lineage did not die with LTE.</b></p>`,
`<p>Five assumptions walked in this morning. <b>None of them walked out.</b></p>
<p><i>[Point left, say the assumption. Point right, say the move. Keep the rhythm.]</i></p>
<p><b>On the ground</b> — Earth to orbit. Act One.</p>
<p><b>Only a radio</b> — a GPU, an AI, and an antivirus moved in. Acts Two and Three.</p>
<p><b>Transmit, then compute</b> — the wave computes in flight. Act Two.</p>
<p><b>Inside links trusted</b> — the fronthaul is an attack surface. Act Three.</p>
<p><b>You need a fake base station</b> — no, you need perfect timing. Act Three.</p>
<p>And one that was never even a box: <b>the cache sits on the ground</b>.</p>
<p>One synthesis, and it is the honest one: <b>openness gives you innovation and attack surface</b>. The same property. Both directions. You do not get to keep only the half you like.</p>
<p>Seven papers, one teaser, <b>one shared trick</b>: <b>find the sentence the diagram never says</b>.</p>
<p>And notice — <b>the diagram did not change today</b>. What changed is <b>how much of it you take on faith</b>.</p>`,

`<p>Three beats, fifteen seconds each. This is a recipe, so I am going to say it like one — you will use it in the practicum.</p>
<p><b>One: find the assumption it breaks.</b> Every paper today had exactly one.</p>
<p><b>Two: ask what it deliberately does not solve.</b> That silence is where the next paper lives.</p>
<p><b>Three: ask what you would build on top of it.</b> That question is the whole practicum.</p>
<p>Steps one and two are in the paper — usually not stated that plainly, so you have to dig. <b>Step three is not in the paper. Step three needs you.</b></p>`,

`<p><i>[Let the line stand on the screen for a few seconds before you speak.]</i></p>
<p><b>The 5G architecture diagram is not the answer. It is the design space.</b></p>
<p>An answer you can only memorise. <b>A design space you can move around in.</b> Every one of the seven papers today did the same thing: <b>took one step inside that space, and then argued the step was a good one.</b></p>
<p>Until today, this course taught you how it works. <b>From here, it asks what you would redesign.</b></p>
<p>The paper practicum starts soon. <b>And Sni5Gect is already on the list.</b></p>`
];

const img=document.getElementById('slide'), note=document.getElementById('note'),
      sec=document.getElementById('sec'), cnt=document.getElementById('count'),
      bar=document.querySelector('#prog>i'), right=document.getElementById('right');
let i=0, buf='', bufT=0;

function pad(n){return String(n).padStart(2,'0')}

function draw(){
  const d=S[i];
  img.src='pages/p-'+pad(i+1)+'.png';
  img.alt=d.t;
  sec.textContent=d.s;
  cnt.textContent=(i+1)+' / '+S.length;
  bar.style.width=((i+1)/S.length*100)+'%';
  note.innerHTML='<h2>'+d.t+'</h2><p class="en">'+d.e+'</p>'+d.n
    +'<div id="script"><h3 class="hdr">SAY THIS IN CLASS</h3>'+(EN[i]||'')+'</div>';
  right.scrollTop=0;
  try{localStorage.setItem('idea-note-page',i)}catch(e){}
}

// ---- language toggle ----
function setLang(m){
  document.body.classList.toggle('only-en', m==='en');
  document.body.classList.toggle('only-zh', m==='zh');
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  try{localStorage.setItem('idea-note-lang',m)}catch(e){}
}
document.querySelectorAll('#lang button').forEach(b=>{
  // blur, or the button keeps focus and Space/Enter re-triggers it instead of paging
  b.addEventListener('click',()=>{setLang(b.dataset.m); b.blur();});
});
let lang='both';
try{ lang=localStorage.getItem('idea-note-lang')||'both'; }catch(e){}
setLang(lang);

function go(n){ i=Math.max(0,Math.min(S.length-1,n)); draw(); }

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){
    e.preventDefault(); go(i+1);
  } else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='Backspace'){
    e.preventDefault(); go(i-1);
  } else if(e.key==='Home'){ e.preventDefault(); go(0); }
  else if(e.key==='End'){ e.preventDefault(); go(S.length-1); }
  else if(/^[0-9]$/.test(e.key)){
    const now=Date.now();
    buf = (now-bufT<1200) ? buf+e.key : e.key;
    bufT=now;
    const n=parseInt(buf,10);
    if(n>=1&&n<=S.length) go(n-1);
  }
});

// click the slide to advance
document.getElementById('left').addEventListener('click',()=>go(i+1));

let start=0;
try{ const v=localStorage.getItem('idea-note-page'); if(v!==null) start=parseInt(v,10)||0; }catch(e){}
go(start);
</script>
